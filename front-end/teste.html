<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta e Edição de Produtos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Campo de Busca */
        .busca-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            margin-bottom: 20px;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f1f1f1;
            color: #444;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f5f5f5;
            cursor: pointer;
        }

        /* Efeito de clique visual */

        /* Imagens na Tabela */
        .imagens-container {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .img-mini {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }

        .preco {
            font-weight: bold;
            color: #28a745;
        }

        /* MODAL ESTRUTURA */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-conteudo {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .fechar-modal {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }

        .fechar-modal:hover {
            color: #333;
        }

        /* Formulário do Modal */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-salvar {
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .btn-salvar:hover {
            background-color: #0056b3;
        }

        /* Grid para miniaturas dentro do modal */
        .grid-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .grid-preview img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border: 1px solid #eee;
            border-radius: 4px;
        }

        #modalMensagem {
            margin-top: 12px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Pesquisar Produtos</h2>

        <!-- Input para digitar a busca -->
        <input type="text" id="campoBusca" class="busca-box" placeholder="Digite o nome do produto para pesquisar...">

        <!-- Tabela simples de resultados -->
        <table>
            <thead>
                <tr>
                    <th style="width: 10%;">ID</th>
                    <th style="width: 25%;">Foto(s)</th>
                    <th style="width: 45%;">Nome</th>
                    <th style="width: 20%;">Preço</th>
                </tr>
            </thead>
            <tbody id="listaProdutos">
                <tr>
                    <td colspan="4" style="text-align: center; color: #888;">Carregando produtos...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div id="modalEdicao" class="modal">
        <div class="modal-conteudo">
            <span class="fechar-modal" id="btnFecharModal">&times;</span>
            <h3>Editar Informações</h3>

            <form id="formEdicao">
                <!-- Campo invisível para armazenar o ID do produto em edição -->
                <input type="hidden" id="editId">

                <div class="form-group">
                    <label for="editNome">Nome do Produto:</label>
                    <input type="text" id="editNome" required>
                </div>

                <div class="form-group">
                    <label for="editPreco">Preço (R$):</label>
                    <input type="number" id="editPreco" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="editImagens">Substituir Imagens (Opcional):</label>
                    <input type="file" id="editImagens" accept="image/*" multiple>
                    <div id="previewImagensAtuais" class="grid-preview"></div>
                </div>

                <button type="submit" class="btn-salvar">Salvar Alterações</button>
            </form>
            <div id="modalMensagem"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/produtos';
        const campoBusca = document.getElementById('campoBusca');
        const listaProdutos = document.getElementById('listaProdutos');

        // Elementos do Modal
        const modal = document.getElementById('modalEdicao');
        const btnFecharModal = document.getElementById('btnFecharModal');
        const formEdicao = document.getElementById('formEdicao');

        let produtosGerais = []; // Guarda todos os produtos carregados do servidor

        // Executa a busca ao abrir a página
        window.addEventListener('DOMContentLoaded', buscarProdutosDoServidor);

        // Faz a requisição GET para o Spring Boot
        async function buscarProdutosDoServidor() {
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    produtosGerais = await response.json();
                    renderizarTabela(produtosGerais);
                } else {
                    listaProdutos.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">Erro no servidor. Status: ${response.status}</td></tr>`;
                }
            } catch (error) {
                console.error(error);
                listaProdutos.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">Não foi possível conectar ao backend.</td></tr>`;
            }
        }

        // Desenha as linhas da tabela na tela
        function renderizarTabela(lista) {
            listaProdutos.innerHTML = '';

            if (lista.length === 0) {
                listaProdutos.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999;">Nenhum produto encontrado.</td></tr>`;
                return;
            }

            lista.forEach(produto => {
                const tr = document.createElement('tr');

                let fotosHtml = '<div class="imagens-container">';
                if (produto.imagensUrls && produto.imagensUrls.length > 0) {
                    produto.imagensUrls.forEach(url => {
                        fotosHtml += `<img class="img-mini" src="http://localhost:8080${url}" onerror="this.src='https://placehold.co'">`;
                    });
                } else {
                    fotosHtml += `<img class="img-mini" src="https://placehold.co">`;
                }
                fotosHtml += '</div>';

                tr.innerHTML = `
                    <td>${produto.id}</td>
                    <td>${fotosHtml}</td>
                    <td><strong>${produto.nome}</strong></td>
                    <td class="preco">R$ ${produto.preco.toFixed(2)}</td>
                `;

                // NOVO: Adiciona o evento de clique na linha para abrir o modal
                tr.addEventListener('click', () => abrirModal(produto));

                listaProdutos.appendChild(tr);
            });
        }

        // LÓGICA DO MODAL
        function abrirModal(produto) {
            document.getElementById('editId').value = produto.id;
            document.getElementById('editNome').value = produto.nome;
            document.getElementById('editPreco').value = produto.preco;
            document.getElementById('modalMensagem').innerText = '';
            document.getElementById('editImagens').value = ''; // Limpa seleção de arquivo anterior

            // Mostra as fotos atuais dentro do modal
            const previewDiv = document.getElementById('previewImagensAtuais');
            previewDiv.innerHTML = '';
            if (produto.imagensUrls) {
                produto.imagensUrls.forEach(url => {
                    const img = document.createElement('img');
                    img.src = `http://localhost:8080${url}`;
                    previewDiv.appendChild(img);
                });
            }

            modal.style.display = 'flex'; // Exibe o modal centralizado
        }

        // Fechar Modal
        btnFecharModal.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

        // Enviar Atualização (PUT)
        formEdicao.addEventListener('submit', async function (event) {
            event.preventDefault();
            const id = document.getElementById('editId').value;
            const msgDiv = document.getElementById('modalMensagem');

            msgDiv.innerText = "Salvando alterações...";
            msgDiv.style.color = "black";

            const formData = new FormData();
            formData.append('nome', document.getElementById('editNome').value);
            formData.append('preco', document.getElementById('editPreco').value);

            const arquivos = document.getElementById('editImagens').files;
            for (let i = 0; i < arquivos.length; i++) {
                formData.append('imagens', arquivos[i]);
            } try {
                const response = await fetch(`http://localhost:8080/produtos/${id}`, 
                    { method: 'PUT', body: formData });
                if (response.ok) {
                    msgDiv.innerText = "Atualizado com sucesso!";
                    msgDiv.style.color = "green";
                    // Recarrega os dados do servidor para atualizar a tabela de fundoawait 
                    buscarProdutosDoServidor();// Fecha o modal após 1 segundo para o usuário ver o 
                    sucessosetTimeout(() => { modal.style.display = 'none'; }, 1000);
                }
                else {
                    msgDiv.innerText = "Erro ao atualizar no servidor.";
                    msgDiv.style.color = "red";
                }
            }
            catch (error) {
                console.error(error);
                msgDiv.innerText = "Erro de conexão com o servidor.";
                msgDiv.style.color = "red";
            }
        });
        // Filtro da caixa de texto (Input do Usuário)
        campoBusca.addEventListener('input', function () {
            const termoPesquisa = this.value.toLowerCase().trim();
            const produtosFiltrados = produtosGerais.filter(produto => { return produto.nome.toLowerCase().includes(termoPesquisa) || produto.id.toString() === termoPesquisa; });
            renderizarTabela(produtosFiltrados);
        });

            </script>
	
	
	
	
</body>
</html>
