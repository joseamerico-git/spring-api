<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Produtos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f7f6;
        }

        .search-container {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* Estilo da Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
            cursor: pointer;
        }

        /* Estilo do Modal */
        .modal {
            display: none;

            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 3% auto;
            padding: 15px;
            padding-bottom: 5px;
            border-radius: 8px;
            width: 380px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .close-btn {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
        }

        .close-btn:hover {
            color: black;
        }

        /* Estilo do Carrossel */
        .carousel-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 350px;
            margin: 20px auto;
        }

        .image-box {
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
            background-color: #fafafa;
            border-radius: 4px;
            overflow: hidden;
        }

        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .btn-nav {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .btn-nav:hover {
            background: #0056b3;
        }

        #indicadorImagem {
            text-align: center;
            margin-top: 5px;
            font-weight: bold;
            color: #555;
        }

        .icone-tabela {
            color: #007bff;
            vertical-align: middle;
            transition: transform 0.2s;
        }

        tr:hover .icone-tabela {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <h2>📦 Busca de Produtos</h2>

    <div class="search-container">
        <input type="text" id="inputBusca" placeholder="Digite o nome do produto para pesquisar..."
            oninput="dispararBuscaComDelay()">
    </div>

    <table id="tabelaProdutos">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th style="text-align: center;">Ação</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="4" style="text-align: center; color: #777;">Digite algo para iniciar a busca...</td>
            </tr>
        </tbody>
    </table>

    <!-- MODAL DE EDIÇÃO -->
    <div id="modalProduto" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharModal()">&times;</span>
            <h3>✏️ Editar Produto</h3>

            <!-- Campo oculto para armazenar o ID do produto -->
            <input type="hidden" id="modalId">

            <div style="margin-bottom: 12px;">
                <label for="modalNome" style="display:block; font-weight:bold; margin-bottom:4px;">Nome:</label>
                <input type="text" id="modalNome" style="width:100%; padding:8px; box-sizing:border-box;">
            </div>

            <div style="margin-bottom: 12px;">
                <label for="modalPreco" style="display:block; font-weight:bold; margin-bottom:4px;">Preço (R$):</label>
                <input type="number" step="0.01" id="modalPreco"
                    style="width:100%; padding:8px; box-sizing:border-box;">
            </div>

            <!-- CARROSSEL (Visualização das Imagens Atuais) -->
            <div class="carousel-container">
                <button class="btn-nav" onclick="mudarImagem(-1)">❮</button>
                <div class="image-box">
                    <img id="previewImagem" src="" alt="Imagem do produto">
                </div>
                <button class="btn-nav" onclick="mudarImagem(1)">❯</button>
            </div>
            <div id="indicadorImagem" style="margin-bottom: 20px;">0 / 0</div>

            <!-- Botão de Ação -->
            <button onclick="salvarAlteracoes()"
                style="width:100%; background:#28a745; color:white; border:none; padding:12px; font-size:16px; border-radius:4px; cursor:pointer; font-weight:bold;">
                Salvar Alterações
            </button>
        </div>
    </div>

    <script>
        // Configuração da URL Base do Spring Boot
        const URL_BACKEND = "http://localhost:8080";

        let timeoutBusca = null;
        let imagensAtuais = [];
        let indiceAtual = 0;

        // 1. Lógica do Debounce (Espera o usuário parar de digitar por 1 segundo)
        function dispararBuscaComDelay() {
            clearTimeout(timeoutBusca);
            const termo = document.getElementById("inputBusca").value.trim();

            if (termo === "") {
                limparTabela();
                return;
            }

            // Aguarda 1000ms antes de executar a pesquisa
            timeoutBusca = setTimeout(() => {
                executarPesquisa(termo);
            }, 1000);
        }

        // 2. Executa a filtragem via Fetch HTTP GET para o back-end Spring Boot
        function ejecutarPesquisa(termo) {
            fetch(`${URL_BACKEND}/produtos/buscar?nome=${encodeURIComponent(termo)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Erro na resposta do servidor");
                    }
                    return response.json();
                })
                .then(dados => {
                    renderizarTabela(dados);
                })
                .catch(err => {
                    console.error("Erro ao buscar dados do Spring Boot:", err);
                    const tbody = document.querySelector("#tabelaProdutos tbody");
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Erro ao conectar com o servidor.</td></tr>`;
                });
        }

        // 3. Renderiza as linhas na tabela dinamicamente sem acumular dados velhos
        function renderizarTabela(listaProdutos) {
            const tbody = document.querySelector("#tabelaProdutos tbody");
            tbody.innerHTML = ""; // Limpa a tabela antes de preencher

            if (listaProdutos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Nenhum produto encontrado.</td></tr>`;
                return;
            }

            listaProdutos.forEach(produto => {
                const tr = document.createElement("tr");

                // Monta a linha com ID, Nome, Preço e o botão de Olho
                tr.innerHTML = `
                    <td>${produto.id}</td>
                    <td>${produto.nome}</td>
                    <td>R$ ${produto.preco.toFixed(2)}</td>
                    <td style="text-align: center;">
                        <span class="icone-tabela" title="Ver/Editar Produto">👁️</span>
                    </td>
                `;

                // Configura o evento de clique na linha para abrir o modal
                tr.onclick = () => abrirModal(produto);
                tbody.appendChild(tr);
            });
        }

        function limparTabela() {
            const tbody = document.querySelector("#tabelaProdutos tbody");
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #777;">Digite algo para iniciar a busca...</td></tr>`;
        }

        // 4. Abre o Modal e Preenche as Informações do Produto Selecionado
        function abrirModal(produto) {
            document.getElementById("modalId").value = produto.id;
            document.getElementById("modalNome").value = produto.nome;
            document.getElementById("modalPreco").value = produto.preco;

            // Tratamento das Imagens (Configurando o link do Backend Spring Boot)
            if (!produto.imagensUrls || produto.imagensUrls.length === 0) {
                imagensAtuais = ["https://picsum.photos"];
            } else {
                // Percorre a lista e concatena o 'http://localhost:8080' se a imagem for interna
                imagensAtuais = produto.imagensUrls.map(url => {
                    if (url.startsWith("http")) {
                        return url; // Se for o Picsum ou link completo, mantém
                    }
                    return ${URL_BACKEND}
                    ${ url };
                    // Se for do banco (/uploads/...), junta com o back
                });
            } indiceAtual = 0; exibirImagem();
            // // Exibe o modal na tela
            document.getElementById("modalProduto").style.display = "block";
        }
        // 5. Controla a Exibição e Navegação das Imagens do Carrosselfunction 
        exibirImagem()
    
            const imgElement = document.getElementById("previewImagem"); const indicador = document.getElementById("indicadorImagem"); if (imagensAtuais.length > 0)
             {
                imgElement.src = imagensAtuais[indiceAtual]; 
                indicador.innerText = `${indiceAtual + 1 } / ${imagensAtuais.length};} else {imgElement.src = "";indicador.innerText = "0 / 0";

            }
        } function mudarImagem(direcao) {
            if (imagensAtuais.length === 0) return; indiceAtual += direcao;
            // Cria o efeito de carrossel infinito (vai para a última ou primeira imagem se estourar o limite)
            if (indiceAtual >= imagensAtuais.length) { indiceAtual = 0; } else if (indiceAtual < 0) { indiceAtual = imagensAtuais.length - 1; } exibirImagem();
        } function fecharModal() { document.getElementById("modalProduto").style.display = "none"; }
        // Fecha o modal caso o usuário clique em qualquer lugar fora da caixa branca
        window.onclick = function (event) { const modal = document.getElementById("modalProduto"); if (event.target === modal) { fecharModal(); } }
        // 6. Envia as modificações de Nome e Preço de volta para a API (Via JSON)
        function salvarAlteracoes() {
            const id = document.getElementById("modalId").value; const nome = document.getElementById("modalNome").value.trim(); const preco = parseFloat(document.getElementById("modalPreco").value); if (!nome || isNaN(preco)) { alert("Preencha todos os campos corretamente."); return; }
            // Recupera a lista original limpando a URL base para enviar apenas o caminho relativo
            const caminhosOriginais = imagensAtuais.map(url => {
                if (url.startsWith(URL_BACKEND)) {
                    return url.replace(URL_BACKEND, "");

                } return url;
            });
            const produtoAtualizado =
                { nome: nome, preco: preco, imagensUrls: caminhosOriginais };
            fetch(`${URL_BACKEND} / produtos / ${id}`, {
                method: "PUT",
                headers: { "Content - Type": "application / json" },
                body: JSON.stringify(produtoAtualizado)
            }).then(response => { if (!response.ok) { throw new Error("Erro ao salvar produto."); } return response.json(); }).then(dados => {
                alert("Produto atualizado com sucesso!"); fecharModal();
                // Atualiza a tabela com o termo que já estava digitado
                const termo = document.getElementById("inputBusca").value.trim(); if (termo !== "") ejecutarPesquisa(termo);
            }).catch(err => { console.error("Erro ao atualizar produto: ", err); alert("Não foi possível salvar as alterações."); });
        }
