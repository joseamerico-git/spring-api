<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambiente de Testes - Produtos</title>
    <!-- Importação da biblioteca de ícones do Google -->
    <link rel="stylesheet" href="https://googleapis.com">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f7f6;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .search-container {
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* Estilização da Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
            cursor: pointer;
        }

        .icone-tabela {
            color: #007bff;
            vertical-align: middle;
            transition: transform 0.2s;
        }

        tr:hover .icone-tabela {
            transform: scale(1.2);
        }

        /* Estilização do Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 25px;
            border-radius: 8px;
            width: 450px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .close-btn {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
        }

        .close-btn:hover {
            color: black;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* Estilização do Carrossel */
        .carousel-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 320px;
            margin: 20px auto;
        }

        .image-box {
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
            background-color: #fafafa;
            border-radius: 4px;
            overflow: hidden;
        }

        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .btn-nav {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 4px;
        }

        .btn-nav:hover {
            background: #0056b3;
        }

        #indicadorImagem {
            text-align: center;
            margin-top: 5px;
            font-weight: bold;
            color: #666;
        }

        /* Botões do Rodapé */
        .modal-footer {
            margin-top: 20px;
            text-align: right;
        }

        .btn-primary {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-secondary {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 5px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>📦 Gerenciador de Produtos (Ambiente de Teste)</h2>

        <!-- Campo de Pesquisa -->
        <div class="search-container">
            <input type="text" id="inputBusca" placeholder="Digite para pesquisar no Spring Boot..."
                oninput="dispararBuscaComDelay()">
        </div>

        <!-- Tabela de Resultados -->
        <table id="tabelaProdutos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th style="text-align: center; width: 60px;">Ação</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="4" style="text-align: center; color: #777;">Digite algo acima para iniciar a pesquisa
                        automática...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- MODAL DE DETALHES E EDIÇÃO -->
    <div id="modalProduto" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharModal()">&times;</span>

            <!-- 1. MODO VISUALIZAÇÃO -->
            <div id="modoVisualizacao">
                <h3 id="modalNome">Nome do Produto</h3>
                <p><strong>Preço:</strong> R$ <span id="modalPreco">0.00</span></p>
            </div>

            <!-- 2. MODO EDIÇÃO (Oculto inicialmente) -->
            <div id="modoEdicao" style="display: none;">
                <h3>Editar Dados do Produto</h3>
                <label for="editNome">Nome do Produto:</label>
                <input type="text" id="editNome">

                <label for="editPreco">Preço (R$):</label>
                <input type="number" step="0.01" id="editPreco">
            </div>

            <!-- 3. CARROSSEL DE IMAGENS (Compartilhado entre os modos) -->
            <div class="carousel-container">
                <button class="btn-nav" onclick="mudarImagem(-1)">&#10094;</button>
                <div class="image-box">
                    <img id="previewImagem" src="" alt="Imagem do produto">
                </div>
                <button class="btn-nav" onclick="mudarImagem(1)">&#10095;</button>
            </div>
            <div id="indicadorImagem">0 / 0</div>

            <!-- 4. BOTÕES DE AÇÃO -->
            <div class="modal-footer">
                <button id="btnCancelarEdicao" class="btn-secondary" onclick="cancelarEdicao()"
                    style="display:none;">Cancelar</button>
                <button id="btnAcaoModal" class="btn-primary" onclick="alternarModoEdicao()">Editar</button>
            </div>
        </div>
    </div>

    <script>
        let timeoutBusca = null;
        let produtoSelecionadoAtual = null;
        let emModoEdicao = false;
        let imagensAtuais = [];
        let indiceAtual = 0;

        const API_URL = "http://localhost:8080/produtos";

        // --- 1. LÓGICA DE BUSCA COM DEBOUNCE (ESPERA 1 SEGUNDO) ---
        function dispararBuscaComDelay() {
            clearTimeout(timeoutBusca);
            const termo = document.getElementById("inputBusca").value.trim();

            if (termo === "") {
                resetarTabela();
                return;
            }

            timeoutBusca = setTimeout(() => {
                executarPesquisa(termo);
            }, 1000);
        }

        function executarPesquisa(termo) {
            fetch(`${API_URL}buscar?nome=${encodeURIComponent(termo)}`)
                .then(response => {
                    if (!response.ok) throw new Error("Erro na resposta do servidor");
                    return response.json();
                })
                .then(dados => renderizarTabela(dados))
                .catch(err => {
                    console.error("Erro ao conectar no Spring Boot:", err);
                    document.querySelector("#tabelaProdutos tbody").innerHTML =
                        `<tr><td colspan="4" style="text-align: center; color: red;">Erro ao conectar com a API Spring Boot. Verifique o CORS.</td></tr>`;
                });
        }

        // --- 2. RENDERIZAÇÃO DA TABELA ---
        function renderizarTabela(listaProdutos) {
            const tbody = document.querySelector("#tabelaProdutos tbody");
            tbody.innerHTML = "";

            if (listaProdutos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ff9800;">Nenhum produto encontrado.</td></tr>`;
                return;
            }

            listaProdutos.forEach(produto => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${produto.id}</td>
                    <td>${produto.nome}</td>
                    <td>R$ ${produto.preco.toFixed(2)}</td>
                    <td style="text-align: center;"><i class="material-icons icone-tabela">visibility</i></td>
                `;
                tr.onclick = () => abrirModal(produto);
                tbody.appendChild(tr);
            });
        }

        function resetarTabela() {
            document.querySelector("#tabelaProdutos tbody").innerHTML =
                `<tr><td colspan="4" style="text-align: center; color: #777;">Digite algo acima para iniciar a pesquisa automática...</td></tr>`;
        }

        // --- 3. CONTROLE DO MODAL ---
        function abrirModal(produto) {
            produtoSelecionadoAtual = produto;
            emModoEdicao = false;

            // Define os textos de visualização
            document.getElementById("modalNome").innerText = produto.nome;
            document.getElementById("modalPreco").innerText = produto.preco.toFixed(2);

            // Reseta estados visuais dos elementos internos
            document.getElementById("modoVisualizacao").style.display = "block";
            document.getElementById("modoEdicao").style.display = "none";
            document.getElementById("btnCancelarEdicao").style.display = "none";

            const btnAcao = document.getElementById("btnAcaoModal");
            btnAcao.innerText = "Editar";
            btnAcao.style.background = "#28a745";

            // Configura o Carrossel de Imagens
            imagensAtuais = produto.imagensUrls || [];
            indiceAtual = 0;
            atualizarCarrossel();

            document.getElementById("modalProduto").style.display = "block";
        }

        function fecharModal() {
            document.getElementById("modalProduto").style.display = "none";
        }

        // --- 4. ALTERNÂNCIA DE MODOS (VISUALIZAR VS EDITAR) ---
        function alternarModoEdicao() {
            if (!emModoEdicao) {
                // Ativa modo edição e joga os valores atuais nos Inputs
                document.getElementById("editNome").value = produtoSelecionadoAtual.nome; document.getElementById("editPreco").value = produtoSelecionadoAtual.preco; document.getElementById("modoVisualizacao").style.display = "none"; document.getElementById("modoEdicao").style.display = "block"; document.getElementById("btnCancelarEdicao").style.display = "inline-block"; const btnAcao = document.getElementById("btnAcaoModal"); btnAcao.innerText = "Salvar"; btnAcao.style.background = "#007bff"; emModoEdicao = true;
            } else {// Se já estava em modo edição e clicou no botão, o botão agora significa "Salvar"
                salvarAlteracoesNoBackend();
            }
        } function cancelarEdicao() {
            abrirModal(produtoSelecionadoAtual);
            // Reabre o modal resetando o estado para o produto original}// 
            // --- 5. REQUISIÇÃO PUT PARA O SERVIDOR ---function 
            salvarAlteracoesNoBackend() {
                const nomeNovo = document.getElementById("editNome").value.trim(); const precoNovo = parseFloat(document.getElementById("editPreco").value); if (!nomeNovo || isNaN(precoNovo)) { alert("Por favor, preencha todos os campos corretamente."); return; }
                // Estrutura enviando o ID no corpo do JSON para coincidir com a URL única de PUTconst 
                dadosAtualizados = { id: produtoSelecionadoAtual.id, nome: nomeNovo, preco: precoNovo, imagensUrls: produtoSelecionadoAtual.imagensUrls }; fetch(API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dadosAtualizados) }).then(response => { if (!response.ok) throw new Error("Falha ao salvar alterações no Spring Boot."); return response.json(); }).then(produtoSalvo => {
                    alert("Produto atualizado com sucesso!"); fecharModal();
                    // Refaz a busca atual para atualizar os dados na tabela em tempo real
                    const termoAtual = document.getElementById("inputBusca").value.trim(); if (termoAtual !== "") executarPesquisa(termoAtual);
                }).catch(err => { console.error("Erro na requisição PUT:", err); alert("Não foi possível salvar os dados. Verifique as configurações do Spring Boot."); });
            }
            // --- 6. MECÂNICA DO CARROSSEL NAVEGÁVEL ---
            function atualizarCarrossel() {
                const imgTag = document.getElementById("previewImagem"); const indicador = document.getElementById("indicadorImagem"); if (imagensAtuais.length > 0) {
                    let urlCompleta = imagensAtuais[indiceAtual];
                    // Se o banco guardar apenas caminhos relativos, injeta o domínio do Spring automaticamente
                    if (!urlCompleta.startsWith("http")) {
                        urlCompleta = `http://localhost:8080${urlCompleta};}
                        imgTag.src = urlCompleta;indicador.innerText = ${indiceAtual + 1} 
                         ${imagensAtuais.length}`;
                    }
                    else { imgTag.src = "placehold.co"; indicador.innerText = "0 de 0"; }
                }
                function mudarImagem(direcao) {
                    if (imagensAtuais.length === 0) return;
                    indiceAtual += direcao; if (indiceAtual >= imagensAtuais.length)
                        indiceAtual = 0; if (indiceAtual < 0) indiceAtual = imagensAtuais.length - 1;
                    atualizarCarrossel();
                }
                // Fecha o modal caso clique na região escura de fora
                window.onclick = function (event) {
                    const modal = document.getElementById("modalProduto");
                    if (event.target === modal) fecharModal();
                }

            }};
            </script>
    
    </body>

</html>
