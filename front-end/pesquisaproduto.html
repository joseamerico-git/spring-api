<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Geral de Produtos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
            margin-top: 0;
        }

        /* Barra de Busca */
        .busca-container {
            margin-bottom: 20px;
        }

        .input-busca {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* Tabela de Dados */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f1f1f1;
            color: #444;
        }

        tr:hover {
            background-color: #f9f9f9;
            cursor: pointer;
        }

        /* Ícones de imagem na tabela */
        .mini-img-container {
            display: flex;
            gap: 4px;
        }

        .img-icone {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }

        .preco-tag {
            font-weight: bold;
            color: #28a745;
        }

        /* Estrutura do Modal (Oculto por padrão) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-conteudo {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .fechar-modal {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }

        .fechar-modal:hover {
            color: #333;
        }

        /* Campos do formulário dentro do Modal */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-salvar {
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .btn-salvar:hover {
            background-color: #0056b3;
        }

        .grid-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .grid-preview img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border: 1px solid #eee;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Consulta Geral de Produtos</h2>

        <!-- Campo de Filtro de Pesquisa -->
        <div class="busca-container">
            <input type="text" id="inputBusca" class="input-busca"
                placeholder="Digite o nome do produto para filtrar...">
        </div>

        <!-- Tabela de Listagem -->
        <table id="tabelaProdutos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Imagens</th>
                    <th>Nome do Produto</th>
                    <th>Preço</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <!-- Inserido dinamicamente via JS -->
            </tbody>
        </table>
    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div id="modalEdicao" class="modal">
        <div class="modal-conteudo">
            <span class="fechar-modal" id="btnFecharModal">&times;</span>
            <h3>Editar Produto</h3>

            <form id="formEdicao">
                <input type="hidden" id="editId">

                <div class="form-group">
                    <label for="editNome">Nome do Produto:</label>
                    <input type="text" id="editNome" required>
                </div>

                <div class="form-group">
                    <label for="editPreco">Preço (R$):</label>
                    <input type="number" id="editPreco" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="editImagens">Atualizar Imagens (Opcional):</label>
                    <input type="file" id="editImagens" accept="image/*" multiple>
                    <div id="previewImagensAtuais" class="grid-preview"></div>
                </div>

                <button type="submit" class="btn-salvar">Salvar Alterações</button>
            </form>
            <div id="modalMensagem" style="margin-top:10px; font-weight:bold; text-align:center;"></div>
        </div>
    </div>

    <script>
        const backendUrl = 'http://localhost:8080';
        let todosProdutos = []; // Guarda a lista global vinda do servidor

        // Elementos do DOM
        const corpoTabela = document.getElementById('corpoTabela');
        const inputBusca = document.getElementById('inputBusca');
        const modal = document.getElementById('modalEdicao');
        const btnFecharModal = document.getElementById('btnFecharModal');
        const formEdicao = document.getElementById('formEdicao');

        // Carrega os dados ao abrir a página
        window.addEventListener('DOMContentLoaded', carregarProdutos);

        // Busca dados do Spring Boot
        async function carregarProdutos() {
            try {
                const response = await fetch(`${backendUrl}/produtos/buscar?nome=`);
                if (response.ok) {
                    todosProdutos = await response.json();
                    renderizarTabela(todosProdutos);
                }
            } catch (error) {
                console.error("Erro ao conectar ao banco:", error);
                corpoTabela.innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Erro ao carregar dados do servidor.</td></tr>`;
            }
        }

        // Renderiza as linhas da tabela baseado em um array
        function renderizarTabela(lista) {
            corpoTabela.innerHTML = '';

            if (lista.length === 0) {
                corpoTabela.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">Nenhum produto encontrado.</td></tr>`;
                return;
            }

            lista.forEach(produto => {
                const tr = document.createElement('tr');

                // Gera a coluna com os mini ícones das fotos
                let iconesHtml = '<div class="mini-img-container">';
                if (produto.imagensUrls && produto.imagensUrls.length > 0) {
                    produto.imagensUrls.forEach(url => {
                        iconesHtml += `<img class="img-icone" src="${backendUrl}${url}" onerror="this.src='https://placehold.co'">`;
                    });
                } else {
                    iconesHtml += `<img class="img-icone" src="https://placehold.co">`;
                }
                iconesHtml += '</div>';

                tr.innerHTML = `
                    <td>${produto.id}</td>
                    <td>${iconesHtml}</td>
                    <td><strong>${produto.nome}</strong></td>
                    <td class="preco-tag">R$ ${produto.preco.toFixed(2)}</td>
                `;

                // Evento de clique na linha abre o Modal preenchido
                tr.addEventListener('click', () => abrirModal(produto));
                corpoTabela.appendChild(tr);
            });
        }

        // Filtro em tempo real digitando na barra de busca
        inputBusca.addEventListener('input', function () {
            const termo = this.value.toLowerCase();
            const filtrados = todosProdutos.filter(p => p.nome.toLowerCase().includes(termo));
            renderizarTabela(filtrados);
        });

        // Abre o modal e injeta os dados do produto selecionado
        function abrirModal(produto) {
            document.getElementById('editId').value = produto.id;
            document.getElementById('editNome').value = produto.nome;
            document.getElementById('editPreco').value = produto.preco;
            document.getElementById('modalMensagem').innerText = '';

            // Renderiza as miniaturas das imagens atuais dentro do modal
            const previewDiv = document.getElementById('previewImagensAtuais');
            previewDiv.innerHTML = '';
            produto.imagensUrls.forEach(url => {
                const img = document.createElement('img');
                img.src = `${backendUrl}${url}`;
                previewDiv.appendChild(img);
            });

            modal.style.display = 'flex';
        }

        // Fecha o modal
        btnFecharModal.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

        // Envio do formulário de atualização (PUT)
        formEdicao.addEventListener('submit', async function (event) {
            event.preventDefault();
            const id = document.getElementById('editId').value;
            const msgDiv = document.getElementById('modalMensagem');
            msgDiv.innerText = "Salvando alterações...";
            msgDiv.style.color = "black";

            const formData = new FormData();
            formData.append('nome', document.getElementById('editNome').value);
            formData.append('preco', document.getElementById('editPreco').value);

            const arquivos = document.getElementById('editImagens').files;
            for (let i = 0; i < arquivos.length; i++) {
                formData.append('imagens', arquivos[i]);
            }

            try {
                const response = await fetch(`${backendUrl}/produtos/${id}`, {
                    method: 'PUT',
                    body: formData
                });
                if (response.ok) {
                    msgDiv.innerText = "Atualizado com sucesso!";
                    msgDiv.style.color = "green";

                    // Recarrega a tabela principal com os novos dadosawait
                    carregarProdutos();// Fecha o modal após 1 
                    segundosetTimeout(() => { modal.style.display = 'none'; }, 1000);
                }
                else {
                    msgDiv.innerText = "Erro ao atualizar produto.";
                    msgDiv.style.color = "red";
                }
            } catch (error) { console.error(error); msgDiv.innerText = "Erro de rede ao salvar."; msgDiv.style.color = "red"; }
        });
