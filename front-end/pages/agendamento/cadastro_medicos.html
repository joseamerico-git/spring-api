<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Médico</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Cadastrar Médico</h2>
    <form id="medicoForm">
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" required placeholder="Ex: Dr. Lucas Silva">
        </div>
        
        <div class="form-group">
            <label for="celular">Celular</label>
            <input type="text" id="celular" required placeholder="Ex: 11999998888">
        </div>
        
        <div class="form-group">
            <label for="numeroCrm">Número CRM</label>
            <input type="text" id="numeroCrm" required placeholder="Ex: CRM/SP 123456">
        </div>
        
        <div class="form-group">
            <label for="foto">Foto do Médico</label>
            <input type="file" id="foto" accept="image/*" required>
        </div>
        
        <button type="submit">Enviar Cadastro</button>
    </form>
    
    <div id="mensagem"></div>
</div>

<script>
    // Função auxiliar para converter o arquivo de imagem para String Base64
    const converteParaBase64 = (file) => {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = (error) => reject(error);
        });
    };

    // Escuta o evento de envio do formulário
    document.getElementById('medicoForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // Impede o recarregamento padrão da página
        
        const msgDiv = document.getElementById('mensagem');
        msgDiv.innerText = "Enviando...";
        msgDiv.style.color = "#333";

        // Coleta os arquivos e campos de texto
        const nome = document.getElementById('nome').value;
        const celular = document.getElementById('celular').value;
        const numeroCrm = document.getElementById('numeroCrm').value;
        const fotoInput = document.getElementById('foto').files[0];

        try {
            // Converte a foto se ela existir
            let fotoBase64 = "";
            if (fotoInput) {
                fotoBase64 = await converteParaBase64(fotoInput);
            }

            // Monta o objeto JSON exatamente como o Spring Boot espera
            const dadosMedico = {
                nome: nome,
                celular: celular,
                numeroCrm: numeroCrm,
                fotoBase64: fotoBase64
            };

            // Faz a requisição AJAX (Fetch API) para o seu backend
            const response = await fetch('http://localhost:8080/medicos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dadosMedico)
            });

            if (response.ok) {
                msgDiv.innerText = "Médico cadastrado com sucesso!";
                msgDiv.style.color = "green";
                document.getElementById('medicoForm').reset(); // Limpa o formulário
            } else {
                msgDiv.innerText = "Erro ao cadastrar médico.";
                msgDiv.style.color = "red";
            }

        } catch (error) {
            console.error("Erro na requisição:", error);
            msgDiv.innerText = "Erro de conexão com o servidor.";
            msgDiv.style.color = "red";
        }
    });
</script>

</body>
</html>
