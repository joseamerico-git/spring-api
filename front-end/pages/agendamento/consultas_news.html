<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedManager - Consultar Agendamentos</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --error-color: #ef4444;
            /* Novas cores para o botão de editar */
            --edit-color: #0d9488;
            --edit-hover: #115e59;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .header {
            margin-bottom: 24px;
        }

        h2 {
            color: var(--text-main);
            font-size: 24px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Barra de Pesquisa */
        .search-box {
            margin-bottom: 24px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            background-color: var(--background);
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Estilização da Tabela */
        .table-container {
            overflow-x: auto;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 15px;
        }

        .custom-table th {
            background-color: var(--background);
            color: var(--text-muted);
            padding: 14px 16px;
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
        }

        .custom-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            vertical-align: middle;
        }

        .custom-table tbody tr:hover {
            background-color: #f8fafc;
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 32px !important;
            font-style: italic;
        }

        /* Estilo do Botão de Editar */
        .btn-edit {
            background-color: var(--edit-color);
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit:hover {
            background-color: var(--edit-hover);
        }

        .btn-edit:active {
            transform: scale(0.96);
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Consultar Agendamentos</h2>
            <p class="subtitle">Visualize e filtre os horários marcados na clínica</p>
        </div>

        <!-- Filtro de Busca em Tempo Real -->
        <div class="search-box">
            <input type="text" id="inputBusca" placeholder="🔍 Digite o nome do paciente ou do médico para filtrar...">
        </div>

        <!-- Listagem de Consultas -->
        <div class="table-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Paciente</th>
                        <th>Médico Responsável</th>
                        <th>Especialidade</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th class="text-center">Ações</th> <!-- Nova Coluna -->
                    </tr>
                </thead>
                <tbody id="tabelaConsultasCorpo">
                    <tr>
                        <td colspan="6" class="no-data">Buscando agendamentos no sistema...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8080/agendamentos";
        let todasAsConsultas = ""; // Guarda a lista global para aplicar os filtros localmente

        // Carrega as consultas direto do GET do ConsultaController
        async function carregarConsultas() {
            const corpoTabela = document.getElementById('tabelaConsultasCorpo');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error();
                todasAsConsultas = await response.json();
                renderizarTabela(todasAsConsultas);
            } catch (error) {
                corpoTabela.innerHTML = `<tr><td colspan="6" class="no-data" style="color: var(--error-color);"> Não foi possível carregar as consultas. Certifique-se de que o backend está rodando. </td></tr>`;
            }
        }

        // Função auxiliar para remover acentos da busca (Insensitive Search)
        function normalizarTexto(texto) {
            return texto.toString().toLowerCase().normalize("NFD").replace(/[\u-\uf]/g, "");
        }

        // Renderiza as linhas na tabela dinamicamente
        function renderizarTabela(lista) {
            const corpoTabela = document.getElementById('tabelaConsultasCorpo');
            corpoTabela.innerHTML = '';

            if (lista.length === 0) {
                corpoTabela.innerHTML = '<tr><td colspan="6" class="no-data">Nenhum agendamento encontrado.</td></tr>';
                return;
            }

            lista.forEach(consulta => {
                const tr = document.createElement('tr');

                // Formatação simples da data (yyyy-MM-dd para dd/mm/yyyy)
                const dataFormatada = consulta.data ? consulta.data.split('-').reverse().join('/') : '--';
                
                // Mapeamento seguro dos nós do objeto Medico injetado pelo JPA
                const nomeMedico = consulta.medico ? consulta.medico.nome : 'Não informado';
                const SkinnerEspecialidade = consulta.medico ? (consulta.medico.especialidade || 'Geral') : '--';

                // Usamos o ID vindo da sua Entidade JPA (geralmente consulta.id) para gerenciar o clique
                const idConsulta = consulta.id || '';

                tr.innerHTML = `
                    <td><strong>${consulta.nomePaciente}</strong></td>
                    <td>Dr(a). ${nomeMedico}</td>
                    <td>${SkinnerEspecialidade}</td>
                    <td>${dataFormatada}</td>
                    <td>${consulta.hora || '--'}</td>
                    <td class="text-center">
                        <button class="btn-edit" onclick="editarConsulta('${idConsulta}')">
                            ✏️ Editar
                        </button>
                    </td>
                `;
                corpoTabela.appendChild(tr);
            });
        }

        // Ação disparada ao clicar no botão Editar
        function editarConsulta(id) {
            if (!id) {
                alert("Não foi possível identificar o ID desta consulta.");
                return;
            }
            
            // Aqui você pode redirecionar para a página de edição ou abrir um modal
            console.log(`Editando a consulta com ID: ${id}`);
            alert(`Ação de editar disparada para a consulta ID: ${id}\nPronto para integrar com a sua API Spring Boot.`);
            
            // Exemplo de redirecionamento:
            // window.location.href = `editar-agendamento.html?id=${id}`;
        }

        // Filtro em tempo real ao digitar na barra de pesquisa (otimizado sem acentos)
        document.getElementById('inputBusca').addEventListener('input', (e) => {
            const termoBusca = normalizarTexto(e.target.value);

            const consultasFiltradas = todasAsConsultas.filter(consulta => {
                const nomePaciente = consulta.nomePaciente ? normalizarTexto(consulta.nomePaciente) : '';
                const nomeMedico = consulta.medico && consulta.medico.nome ? normalizarTexto(consulta.medico.nome) : '';
                
                return nomePaciente.includes(termoBusca) || nomeMedico.includes(termoBusca);
            });

            renderizarTabela(consultasFiltradas);
        });

        // Inicializa a busca assim que o arquivo abre no navegador
        window.onload = carregarConsultas;
    </script>
</body>
</html>
