<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedManager - Consultar Agendamentos</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --error-color: #ef4444;
            --edit-color: #0d9488;
            --edit-hover: #115e59;

            /* Cores para os Badges de Status */
            --bg-agendado: #dbeafe;
            --text-agendado: #1e40af;
            --bg-realizado: #dcfce7;
            --text-realizado: #166534;
            --bg-cancelado: #fee2e2;
            --text-cancelado: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .header {
            margin-bottom: 24px;
        }

        h2 {
            color: var(--text-main);
            font-size: 24px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-box {
            margin-bottom: 24px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            background-color: var(--background);
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .table-container {
            overflow-x: auto;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 15px;
        }

        .custom-table th {
            background-color: var(--background);
            color: var(--text-muted);
            padding: 14px 16px;
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
        }

        .custom-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            vertical-align: middle;
        }

        .custom-table tbody tr:hover {
            background-color: #f8fafc;
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 32px !important;
            font-style: italic;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-agendado {
            background-color: var(--bg-agendado);
            color: var(--text-agendado);
        }

        .badge-realizado {
            background-color: var(--bg-realizado);
            color: var(--text-realizado);
        }

        .badge-cancelado {
            background-color: var(--bg-cancelado);
            color: var(--text-cancelado);
        }

        .btn-edit {
            background-color: var(--edit-color);
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit:hover {
            background-color: var(--edit-hover);
        }

        .btn-edit:active {
            transform: scale(0.96);
        }

        .text-center {
            text-align: center;
        }

        /* --- ESTILOS DO MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            transform: translateY(-20px);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .modal-body p {
            margin-bottom: 12px;
            font-size: 15px;
            color: var(--text-main);
        }

        .modal-body strong {
            color: var(--text-muted);
            display: inline-block;
            width: 120px;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .btn-close:hover {
            color: var(--error-color);
        }

        /* --- NOVOS ESTILOS DO FORMULÁRIO INTERNO E BOTÕES DO MODAL --- */
        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            background-color: var(--background);
            transition: all 0.2s;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .btn-cancelar {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .btn-cancelar:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .btn-salvar {
            padding: 10px 20px;
            border: none;
            background-color: var(--primary-color);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: background-color 0.2s;
        }

        .btn-salvar:hover {
            background-color: #1d4ed8; /* Cor escura de destaque */
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h2>Consultar Agendamentos</h2>
            <p class="subtitle">Visualize e filtre os horários marcados na clínica</p>
        </div>

        <div class="search-box">
            <input type="text" id="inputBusca" placeholder="🔍 Digite o nome do paciente ou do médico para filtrar...">
        </div>

        <div class="table-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Paciente</th>
                        <th>Médico Responsável</th>
                        <th>Especialidade</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Status</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaConsultasCorpo">
                    <tr>
                        <td colspan="7" class="no-data">Buscando agendamentos no sistema...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

     <!-- ESTRUTURA DO MODAL DE ALTERAÇÃO -->
    <div id="modalConsulta" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Alterar Dados da Consulta</h3>
                <button type="button" class="btn-close" onclick="fecharModal()">&times;</button>
            </div>
            <form id="formEditarConsulta" onsubmit="salvarAlteracoes(event)">
                
                <!-- O JavaScript vai injetar os campos aqui dentro -->
                <div id="modalBody"></div>
                
                <!-- Rodapé com os botões alinhados -->
                <div class="modal-actions">
                    <button type="button" onclick="fecharModal()" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>




    <script>
        const API_URL = "http://localhost:8080/agendamentos";
        let todasAsConsultas = [];

        async function carregarConsultas() {
            const corpoTabela = document.getElementById('tabelaConsultasCorpo');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error();
                todasAsConsultas = await response.json();
                renderizarTabela(todasAsConsultas);
            } catch (error) {
                corpoTabela.innerHTML = `<tr><td colspan="7" class="no-data" style="color: var(--error-color);"> Não foi possível carregar as consultas. Certifique-se de que o backend está rodando. </td></tr>`;
            }
        }

        document.getElementById('inputBusca').addEventListener('input', (e) => {
            const termo = normalizarTexto(e.target.value);
            const filtradas = todasAsConsultas.filter(consulta => {
                const paciente = normalizarTexto(consulta.nomePaciente || '');
                const medico = normalizarTexto(consulta.medico ? consulta.medico.nome : '');
                return paciente.includes(termo) || medico.includes(termo);
            });
            renderizarTabela(filtradas);
        });

        function normalizarTexto(texto) {
            return texto.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function renderizarTabela(lista) {
            const corpoTabela = document.getElementById('tabelaConsultasCorpo');
            corpoTabela.innerHTML = '';

            if (lista.length === 0) {
                corpoTabela.innerHTML = `<tr><td colspan="7" class="no-data">Nenhum agendamento encontrado.</td></tr>`;
                return;
            }

            lista.forEach(consulta => {
                const tr = document.createElement('tr');

                const dataFormatada = consulta.data ? consulta.data.split('-').reverse().join('/') : '--';
                const nomeMedico = consulta.medico ? consulta.medico.nome : `Não informado`;
                const especialidade = consulta.medico ? (consulta.medico.especialidade || 'Geral') : '--';
                const horario = consulta.horario || '--';
                const status = consulta.status ? consulta.status.toLowerCase() : 'agendado';
                
                let classeBadge = 'badge-agendado';
                if (status === 'realizado') classeBadge = 'badge-realizado';
                if (status === 'cancelado') classeBadge = 'badge-cancelado';
                
                // CORREÇÃO: Adicionado <td> para as colunas e a tag da badge
                // CORREÇÃO: Adicionado botão de ação para acionar o modal passando o ID da consulta
                tr.innerHTML = `
                    <td>${consulta.nomePaciente || "Não informado"}</td>
                    <td>${nomeMedico}</td>
                    <td>${especialidade}</td>
                    <td>${dataFormatada}</td>
                    <td>${horario}</td>
                    <td><span class="badge ${classeBadge}">${status}</span></td>
                    <td>
                        <button onclick="abrirModal(${consulta.id})" class="btn-detalhes">Ver Detalhes</button>
                    </td>
                `;

                corpoTabela.appendChild(tr);
            });
        }

        // FUNÇÕES DO MODAL
        function abrirModal(id) {
    const consulta = todasAsConsultas.find(c => c.id === id);
    if (!consulta) return;
    
    idConsultaEmEdicao = id; // Armazena o ID globalmente

    const nomeMedico = consulta.medico ? consulta.medico.nome : '';
    const especialidade = consulta.medico ? (consulta.medico.especialidade || 'Geral') : 'Geral';
    const statusAtual = consulta.status ? consulta.status.toLowerCase() : 'agendado';
    
    const modalBody = document.getElementById('modalBody');
    
    // Injeta apenas os campos. O <form> e os botões de ação ficam fixos no HTML.
    modalBody.innerHTML = `
        <div class="form-group">
            <label for="editPaciente">Paciente:</label>
            <input type="text" id="editPaciente" value="${consulta.nomePaciente || ''}" required>
        </div>
        <div class="form-group">
            <label for="editMedico">Médico:</label>
            <input type="text" id="editMedico" value="${nomeMedico}" required>
        </div>
        <div class="form-group">
            <label for="editEspecialidade">Especialidade:</label>
            <input type="text" id="editEspecialidade" value="${especialidade}">
        </div>
        <div class="form-group">
            <label for="editData">Data:</label>
            <input type="date" id="editData" value="${consulta.data || ''}" required>
        </div>
        <div class="form-group">
            <label for="editHorario">Horário:</label>
            <input type="time" id="editHorario" value="${consulta.horario || ''}" required>
        </div>
        <div class="form-group">
            <label for="editStatus">Status:</label>
            <select id="editStatus">
                <option value="agendado" ${statusAtual === 'agendado' ? 'selected' : ''}>Agendado</option>
                <option value="realizado" ${statusAtual === 'realizado' ? 'selected' : ''}>Realizado</option>
                <option value="cancelado" ${statusAtual === 'cancelado' ? 'selected' : ''}>Cancelado</option>
            </select>
        </div>
    `;
    
    document.getElementById('modalConsulta').classList.add('active');
}
        function fecharModal() {
            document.getElementById('modalConsulta').classList.remove('active');
        }

        window.onclick = function (event) {
            const modal = document.getElementById('modalConsulta');
            if (event.target === modal) {
                fecharModal();
            }
        }

        // CORREÇÃO: Linha incompleta corrigida para carregar os dados ao abrir a página
        window.addEventListener('DOMContentLoaded', carregarConsultas);
</script>

</body>

</html>
