<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Médico</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        /* Estilos do Preview da Foto */
        .preview-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .image-preview {
            width: 120px;
            height: 120px;
            border: 2px dashed #ccc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #f9f9f9;
            position: relative;
        }
        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Escondido até ter uma imagem */
        }
        .preview-placeholder {
            color: #aaa;
            font-size: 12px;
            text-align: center;
            padding: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Cadastrar Médico</h2>
    
    <!-- Área do Preview da Foto -->
    <div class="preview-container">
        <div class="image-preview" id="imagePreview">
            <span class="preview-placeholder" id="previewPlaceholder">Sem Foto</span>
            <img src="" alt="Preview da Foto" id="previewImg">
        </div>
    </div>

    <form id="medicoForm">
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" required placeholder="Ex: Dr. Lucas Silva">
        </div>
        
        <div class="form-group">
            <label for="celular">Celular</label>
            <input type="text" id="celular" required placeholder="Ex: 11999998888">
        </div>
        
        <div class="form-group">
            <label for="numeroCrm">Número CRM</label>
            <input type="text" id="numeroCrm" required placeholder="Ex: CRM/SP 123456">
        </div>
        
        <div class="form-group">
            <label for="foto">Foto do Médico</label>
            <input type="file" id="foto" accept="image/*" required>
        </div>
        
        <button type="submit">Enviar Cadastro</button>
    </form>
    
    <div id="mensagem"></div>
</div>

<script>
    const fotoInput = document.getElementById('foto');
    const previewImg = document.getElementById('previewImg');
    const previewPlaceholder = document.getElementById('previewPlaceholder');

    // Escuta mudanças no campo de arquivo para atualizar o Preview
    fotoInput.addEventListener('change', function() {
        const file = this.files[0];
        
        if (file) {
            const reader = new FileReader();
            
            reader.onload = function(e) {
                // Alimenta a tag img com o Base64 gerado temporariamente
                previewImg.setAttribute('src', e.target.result);
                previewImg.style.display = 'block';
                previewPlaceholder.style.display = 'none';
            }
            
            reader.readAsDataURL(file);
        } else {
            // Reseta se o usuário cancelar a seleção
            previewImg.setAttribute('src', '');
            previewImg.style.display = 'none';
            previewPlaceholder.style.display = 'block';
        }
    });

    // Função utilizada no envio do formulário
    const converteParaBase64 = (file) => {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = (error) => reject(error);
        });
    };

    // Envio do formulário
    document.getElementById('medicoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const msgDiv = document.getElementById('mensagem');
        msgDiv.innerText = "Enviando...";
        msgDiv.style.color = "#333";

        const nome = document.getElementById('nome').value;
        const celular = document.getElementById('celular').value;
        const numeroCrm = document.getElementById('numeroCrm').value;
        const arquivos = fotoInput.files;

        try {
            let fotoBase64 = "";
            if (arquivos.length > 0) {
                fotoBase64 = await converteParaBase64(arquivos[0]);
            }

            const dadosMedico = {
                nome: nome,
                celular: celular,
                numeroCrm: numeroCrm,
                fotoBase64: fotoBase64
            };

            const response = await fetch('http://localhost:8080/medicos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dadosMedico)
            });

            if (response.ok) {
                msgDiv.innerText = "Médico cadastrado com sucesso!";
                msgDiv.style.color = "green";
                
                // Reseta o formulário e o preview
                document.getElementById('medicoForm').reset();
                previewImg.style.display = 'none';
                previewPlaceholder.style.display = 'block';
            } else {
                msgDiv.innerText = "Erro ao cadastrar médico.";
                msgDiv.style.color = "red";
            }

        } catch (error) {
            console.error("Erro:", error);
            msgDiv.innerText = "Erro de conexão com o servidor.";
            msgDiv.style.color = "red";
        }
    });
</script>

</body>
</html>
