<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Médico</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .camera-container { display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px; }
        video, canvas { width: 100%; max-width: 320px; border: 1px solid #ccc; border-radius: 4px; }
        #preview { max-width: 150px; max-height: 150px; display: none; margin-top: 10px; border: 2px dashed #007bff; border-radius: 4px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-success { background-color: #28a745; color: white; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Cadastrar Novo Médico</h2>
    
    <form id="medicoForm">
        <!-- Dados do Médico -->
        <div class="form-group">
            <label for="nome">Nome do Médico:</label>
            <input type="text" id="nome" required placeholder="Ex: Dr. Carlos Silva">
        </div>
        
        <div class="form-group">
            <label for="crm">CRM:</label>
            <input type="text" id="crm" required placeholder="Ex: 123456/SP">
        </div>

        <!-- NOVO CAMPO: Celular -->
        <div class="form-group">
            <label for="celular">Celular:</label>
            <input type="text" id="celular" required placeholder="Ex: (11) 99999-9999">
        </div>

        <!-- Seleção do tipo de captura da Foto -->
        <div class="form-group">
            <label>Foto do Médico:</label>
            <button type="button" class="btn btn-secondary" id="btnModoUpload">Enviar Arquivo</button>
            <button type="button" class="btn btn-secondary" id="btnModoCamera">Usar Webcam</button>
        </div>

        <!-- Opção 1: Upload de Arquivo Local -->
        <div class="form-group" id="containerUpload" style="display: none;">
            <input type="file" id="inputArquivo" accept="image/*">
        </div>

        <!-- Opção 2: Captura pela Câmera -->
        <div class="camera-container" id="containerCamera">
            <video id="video" autoplay playsinline></video>
            <button type="button" class="btn btn-primary" id="btnCapturar">Tirar Foto</button>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <!-- Área de Preview da Imagem Selecionada/Tirada -->
        <div class="form-group">
            <label>Preview da Foto:</label>
            <img id="preview" alt="Preview da imagem">
        </div>

        <button type="submit" class="btn btn-success">Salvar Médico</button>
    </form>

    <script>
        const API_URL = 'http://localhost:8080/medicos';
        
        const form = document.getElementById('medicoForm');
        const btnModoUpload = document.getElementById('btnModoUpload');
        const btnModoCamera = document.getElementById('btnModoCamera');
        const containerUpload = document.getElementById('containerUpload');
        const containerCamera = document.getElementById('containerCamera');
        const inputArquivo = document.getElementById('inputArquivo');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnCapturar = document.getElementById('btnCapturar');
        const imgPreview = document.getElementById('preview');

        let imagemBlob = null;
        let streamCamera = null;

        btnModoUpload.addEventListener('click', () => {
            containerUpload.style.display = 'block';
            containerCamera.style.display = 'none';
            fecharCamera();
        });

        btnModoCamera.addEventListener('click', async () => {
            containerUpload.style.display = 'none';
            containerCamera.style.display = 'flex';
            
            try {
                streamCamera = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = streamCamera;
            } catch (err) {
                alert('Não foi possível acessar a sua câmera: ' + err.message);
            }
        });

        function fecharCamera() {
            if (streamCamera) {
                streamCamera.getTracks().forEach(track => track.stop());
                streamCamera = null;
            }
        }

        inputArquivo.addEventListener('change', (e) => {
            const arquivo = e.target.files[0];
            if (arquivo) {
                imagemBlob = arquivo;
                exibirPreview(arquivo);
            }
        });

        btnCapturar.addEventListener('click', () => {
            if (!streamCamera) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const contexto = canvas.getContext('2d');
            contexto.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
                imagemBlob = blob;
                exibirPreview(blob);
                fecharCamera();
                containerCamera.style.display = 'none';
            }, 'image/jpeg');
        });

        function exibirPreview(fonte) {
            imgPreview.src = URL.createObjectURL(fonte);
            imgPreview.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!imagemBlob) {
                alert('Por favor, adicione uma foto por arquivo ou tire uma pela webcam!');
                return;
            }

            // Mapeando os dados incluindo o celular
            const dadosMedico = {
                nome: document.getElementById('nome').value,
                numeroCrm: document.getElementById('crm').value,
                celular: document.getElementById('celular').value // Campo adicionado
            };

            const formData = new FormData();
            formData.append('medico', new Blob([JSON.stringify(dadosMedico)], { type: 'application/json' }));
            formData.append('foto', imagemBlob, imagemBlob.name || 'foto_webcam.jpg');

            try {
                const resposta = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                if (resposta.ok) {
                    const resultado = await resposta.json();
                    alert('Médico cadastrado com sucesso!');
                    console.log('Dados salvos:', resultado);
                    
                    form.reset();
                    imgPreview.style.display = 'none';
                    imagemBlob = null;
                } else {
                    const erroTexto = await resposta.text();
                    alert('Erro ao cadastrar médico: ' + erroTexto);
                }
            } catch (erro) {
                console.error(erro);
                alert('Erro de conexão com o servidor da API.');
            }
        });
    </script>
</body>
</html>
