<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Médico</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: var(--primary-color);
            text-align: center;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--card-bg);
            color: var(--text-main);
        }

        .btn:hover {
            background: #f1f5f9;
        }

        .btn-active {
            background: #eff6ff;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* Container de Upload Oculto */
        #containerUpload {
            margin-top: 10px;
        }

        input[type="file"] {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Container da Câmera */
        .camera-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
        }

        video,
        canvas {
            width: 100%;
            max-width: 280px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .btn-capture {
            background: var(--primary-color);
            color: white;
            border: none;
        }

        .btn-capture:hover {
            background: var(--primary-hover);
        }

        /* Container Identificado com o mesmo estilo do Listar */
        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 25px;
            padding: 20px;
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            background: #fafafa;
        }

        /* O Preview agora é idêntico ao Avatar da listagem */
        .doctor-avatar-preview {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #eff6ff;
            background-color: #f1f5f9;
            display: none;
            /* Só aparece quando tiver imagem */
            margin-top: 8px;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Novo Profissional</h2>
        <p class="subtitle">Insira as informações do médico no sistema</p>

        <form id="medicoForm">
            <div class="form-group">
                <label for="nome">Nome do Médico:</label>
                <input type="text" id="nome" required placeholder="Ex: Dr. Carlos Silva">
            </div>

            <div class="form-group">
                <label for="crm">CRM:</label>
                <input type="text" id="crm" required placeholder="Ex: 123456/SP">
            </div>

            <div class="form-group">
                <label for="celular">Celular:</label>
                <input type="text" id="celular" required placeholder="Ex: (11) 99999-9999" maxlength="15">
            </div>

            <div class="form-group">
                <label>Foto do Médico:</label>
                <div class="btn-group">
                    <button type="button" class="btn" id="btnModoUpload">Enviar Arquivo</button>
                    <button type="button" class="btn" id="btnModoCamera">Usar Webcam</button>
                </div>

                <!-- Opção 1: Arquivo -->
                <div id="containerUpload" style="display: none;">
                    <input type="file" id="inputArquivo" accept="image/*">
                </div>

                <!-- Opção 2: Câmera -->
                <div class="camera-container" id="containerCamera">
                    <video id="video" autoplay playsinline></video>
                    <button type="button" class="btn btn-capture" id="btnCapturar">Tirar Foto</button>
                    <canvas id="canvas" style="display:none;"></canvas>
                </div>
            </div>

            <!-- Área de Preview Estilizada igual ao Card -->
            <div class="preview-container">
                <label>Visualização do Perfil</label>
                <img id="preview" class="doctor-avatar-preview" alt="Preview da imagem">
            </div>

            <button type="submit" class="btn-submit">Salvar Médico</button>
        </form>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/medicos';

        const form = document.getElementById('medicoForm');
        const btnModoUpload = document.getElementById('btnModoUpload');
        const btnModoCamera = document.getElementById('btnModoCamera');
        const containerUpload = document.getElementById('containerUpload');
        const containerCamera = document.getElementById('containerCamera');
        const inputArquivo = document.getElementById('inputArquivo');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnCapturar = document.getElementById('btnCapturar');
        const imgPreview = document.getElementById('preview');
        const inputCelular = document.getElementById('celular');

        let imagemBlob = null;
        let streamCamera = null;

        // Máscara dinâmica para o celular
        inputCelular.addEventListener('input', (e) => {
            let valor = e.target.value.replace(/\D/g, "");
            if (valor.length > 11) valor = valor.slice(0, 11);

            if (valor.length > 6) {
                valor = `(${valor.slice(0, 2)}) ${valor.slice(2, 7)}-${valor.slice(7)}`;
            } else if (valor.length > 2) {
                valor = `(${valor.slice(0, 2)}) ${valor.slice(2)}`;
            } else if (valor.length > 0) {
                valor = `(${valor}`;
            }
            e.target.value = valor;
        });

        // Alternadores de Modo de Captura
        btnModoUpload.addEventListener('click', () => {
            btnModoUpload.classList.add('btn-active');
            btnModoCamera.classList.remove('btn-active');
            containerUpload.style.display = 'block';
            containerCamera.style.display = 'none';
            fecharCamera();
        });

        btnModoCamera.addEventListener('click', async () => {
            btnModoCamera.classList.add('btn-active');
            btnModoUpload.classList.remove('btn-active');
            containerUpload.style.display = 'none';
            containerCamera.style.display = 'flex';

            try {
                streamCamera = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = streamCamera;
            } catch (err) {
                alert('Não foi possível acessar a sua câmera: ' + err.message);
            }
        });

        function fecharCamera() {
            if (streamCamera) {
                streamCamera.getTracks().forEach(track => track.stop());
                streamCamera = null;
            }
        }

        inputArquivo.addEventListener('change', (e) => {
            const arquivo = e.target.files[0];
            if (arquivo) {
                imagemBlob = arquivo;
                exibirPreview(arquivo);
            }
        });

        btnCapturar.addEventListener('click', () => {
            if (!streamCamera) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const contexto = canvas.getContext('2d');
            contexto.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
                imagemBlob = blob;
                exibirPreview(blob); fecharCamera(); containerCamera.style.display = 'none'; btnModoCamera.classList.remove('btn-active');
            }, 'image/jpeg');
        });
        function exibirPreview(fonte) { imgPreview.src = URL.createObjectURL(fonte); imgPreview.style.display = 'block'; }
        // Envio do formulário
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); if (!imagemBlob) { alert('Por favor, adicione uma foto por arquivo ou tire uma pela webcam!'); return; }
            // CORRIGIDO: numeroCrm mapeado certinho para o Java
            const dadosMedico = {
                nome: document.getElementById('nome').value,
                numeroCrm: document.getElementById('crm').value,
                celular: inputCelular.value
            };
            const formData = new FormData();
            formData.append('medico', new Blob([JSON.stringify(dadosMedico)],
                { type: 'application/json' }));
            formData.append('foto', imagemBlob, imagemBlob.name || 'foto_webcam.jpg');
            try {
                const response = await fetch(API_URL, { method: 'POST', body: formData });
                if (response.ok) {
                    const resultado = await response.json();
                    alert('Médico cadastrado com sucesso!');
                    console.log('Salvo:', resultado);
                    form.reset(); 
                    imgPreview.style.display = 'none'; 
                    imagemBlob = null; btnModoUpload.classList.remove('btn-active');
                } else { const erroTexto = await response.text();
                     alert('Erro ao cadastrar médico: ' + erroTexto); }
            } catch (erro) { console.error(erro);
                 alert('Erro de conexão com o servidor da API.'); }
        });
        </script>
</body>
</html>
