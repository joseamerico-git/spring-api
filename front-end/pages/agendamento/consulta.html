<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedManager - Consultar Agendamentos</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .header {
            margin-bottom: 24px;
        }

        h2 {
            color: var(--text-main);
            font-size: 24px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Barra de Pesquisa */
        .search-box {
            margin-bottom: 24px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            background-color: var(--background);
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Estilização da Tabela */
        .table-container {
            overflow-x: auto;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 15px;
        }

        .custom-table th {
            background-color: var(--background);
            color: var(--text-muted);
            padding: 14px 16px;
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
        }

        .custom-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .custom-table tbody tr:hover {
            background-color: #f8fafc;
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 32px !important;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h2>Consultar Agendamentos</h2>
            <p class="subtitle">Visualize e filtre os horários marcados na clínica</p>
        </div>

        <!-- Filtro de Busca em Tempo Real -->
        <div class="search-box">
            <input type="text" id="inputBusca" placeholder="🔍 Digite o nome do paciente ou do médico para filtrar...">
        </div>

        <!-- Listagem de Consultas -->
        <div class="table-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Paciente</th>
                        <th>Médico Responsável</th>
                        <th>Especialidade</th>
                        <th>Data</th>
                        <th>Horário</th>
                    </tr>
                </thead>
                <tbody id="tabelaConsultasCorpo">
                    <tr>
                        <td colspan="5" class="no-data">Buscando agendamentos no sistema...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8080/agendamentos";
        let todasAsConsultas = []; // Guarda a lista global para aplicar os filtros localmente

        // Carrega as consultas direto do GET do ConsultaController
        async function carregarConsultas() {
            const corpoTabela = document.getElementById('tabelaConsultasCorpo');
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error();
                
                todasAsConsultas = await response.json();
                renderizarTabela(todasAsConsultas);

            } catch (error) {
                corpoTabela.innerHTML = `<tr><td colspan="5" class="no-data" style="color: var(--error-color);">
                    Não foi possível carregar as consultas. Certifique-se de que o backend está rodando.
                </td></tr>`;
            }
        }

        // Renderiza as linhas na tabela dinamicamente
        function renderizarTabela(lista) {
            const corpoTabela = document.getElementById('tabelaConsultasCorpo');
            corpoTabela.innerHTML = '';

            if (lista.length === 0) {
                corpoTabela.innerHTML = '<tr><td colspan="5" class="no-data">Nenhum agendamento encontrado.</td></tr>';
                return;
            }

            lista.forEach(consulta => {
                const tr = document.createElement('tr');
                
                // Formatação simples da data (yyyy-MM-dd para dd/mm/yyyy)
                const dataFormatada = consulta.data ? consulta.data.split('-').reverse().join('/') : '--';
                
                // Mapeamento seguro dos nós do objeto Medico injetado pelo JPA
                const nomeMedico = consulta.medico ? consulta.medico.nome : 'Não informado';
                const especialidade = consulta.medico ? (consulta.medico.especialidade || 'Geral') : '--';

                tr.innerHTML = `
                    <td><strong>${consulta.nomePaciente}</strong></td>
                    <td>Dr(a). ${nomeMedico}</td>
                    <td>${especialidade}</td>
                    <td>${dataFormatada}</td>
                    <td>${consulta.hora || '--'}</td>
                `;
                corpoTabela.appendChild(tr);
            });
        }

        // Filtro em tempo real ao digitar na barra de pesquisa
        document.getElementById('inputBusca').addEventListener('input', (e) => {
            const termoBusca = e.target.value.toLowerCase();
            
            const consultasFiltradas = todasAsConsultas.filter(consulta => {
                const nomePaciente = consulta.nomePaciente ? consulta.nomePaciente.toLowerCase() : '';
                const nomeMedico = consulta.medico && consulta.medico.nome ? consulta.medico.nome.toLowerCase() : '';
                
                return nomePaciente.includes(termoBusca) || nomeMedico.includes(termoBusca);
            });

            renderizarTabela(consultasFiltradas);
        });

        // Inicializa a busca assim que o arquivo abre no navegador
        window.onload = carregarConsultas;
    </script>
</body>

</html>
