<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedManager - Consultar Agendamentos</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --error-color: #ef4444;
            --edit-color: #0d9488;
            --edit-hover: #115e59;
            
            /* Cores para os Badges de Status */
            --bg-agendado: #dbeafe;
            --text-agendado: #1e40af;
            --bg-realizado: #dcfce7;
            --text-realizado: #166534;
            --bg-cancelado: #fee2e2;
            --text-cancelado: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px; /* Aumentado levemente para acomodar a nova coluna */
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .header {
            margin-bottom: 24px;
        }

        h2 {
            color: var(--text-main);
            font-size: 24px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-box {
            margin-bottom: 24px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            background-color: var(--background);
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .table-container {
            overflow-x: auto;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 15px;
        }

        .custom-table th {
            background-color: var(--background);
            color: var(--text-muted);
            padding: 14px 16px;
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
        }

        .custom-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            vertical-align: middle;
        }

        .custom-table tbody tr:hover {
            background-color: #f8fafc;
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 32px !important;
            font-style: italic;
        }

        /* Estilização dos Badges de Status */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-agendado {
            background-color: var(--bg-agendado);
            color: var(--text-agendado);
        }

        .badge-realizado {
            background-color: var(--bg-realizado);
            color: var(--text-realizado);
        }

        .badge-cancelado {
            background-color: var(--bg-cancelado);
            color: var(--text-cancelado);
        }

        .btn-edit {
            background-color: var(--edit-color);
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit:hover {
            background-color: var(--edit-hover);
        }

        .btn-edit:active {
            transform: scale(0.96);
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Consultar Agendamentos</h2>
            <p class="subtitle">Visualize e filtre os horários marcados na clínica</p>
        </div>

        <div class="search-box">
            <input type="text" id="inputBusca" placeholder="🔍 Digite o nome do paciente ou do médico para filtrar...">
        </div>

        <div class="table-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Paciente</th>
                        <th>Médico Responsável</th>
                        <th>Especialidade</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Status</th> <!-- Nova Coluna adicionada -->
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaConsultasCorpo">
                    <tr>
                        <td colspan="7" class="no-data">Buscando agendamentos no sistema...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8080/agendamentos";
        let todasAsConsultas = []; 

        // Carrega as consultas do backend
        async function carregarConsultas() {
            const corpoTabela = document.getElementById('tabelaConsultasCorpo');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error();
                todasAsConsultas = await response.json();
                renderizarTabela(todasAsConsultas);
            } catch (error) {
                corpoTabela.innerHTML = `<tr><td colspan="7" class="no-data" style="color: var(--error-color);"> Não foi possível carregar as consultas. Certifique-se de que o backend está rodando. </td></tr>`;
            }
        }

        // Configura o filtro em tempo real
        document.getElementById('inputBusca').addEventListener('input', (e) => {
            const termo = normalizarTexto(e.target.value);
            const filtradas = todasAsConsultas.filter(consulta => {
                const paciente = normalizarTexto(consulta.nomePaciente || '');
                const medico = normalizarTexto(consulta.medico ? consulta.medico.nome : '');
                return paciente.includes(termo) || medico.includes(termo);
            });
            renderizarTabela(filtradas);
        });

        function normalizarTexto(texto) {
            return texto.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        // Renderiza as linhas na tabela dinamicamente
        function renderizarTabela(lista) {
            const corpoTabela = document.getElementById('tabelaConsultasCorpo');
            corpoTabela.innerHTML = '';

            if (lista.length === 0) {
                corpoTabela.innerHTML = '<tr><td colspan="7" class="no-data">Nenhum agendamento encontrado.</td></tr>';
                return;
            }

            lista.forEach(consulta => {
                const tr = document.createElement('tr');

                const dataFormatada = consulta.data ? consulta.data.split('-').reverse().join('/') : '--';
                const nomeMedico = consulta.medico ? consulta.medico.nome : 'Não informado';
                const especialidade = consulta.medico ? (consulta.medico.especialidade || 'Geral') : '--';
                const idConsulta = consulta.id || '';
                
                // Trata o status vindo do backend e define a classe CSS correta
                const statusAtual = consulta.status || 'AGENDADO';
                const classeBadge = `badge-${statusAtual.toLowerCase()}`;

                tr.innerHTML = `
                    <td><strong>${consulta.nomePaciente}</strong></td>
                    <td>Dr(a). ${nomeMedico}</td>
                    <td>${especialidade}</td>
                    <td>${dataFormatada}</td>
                    <td>${consulta.hora || '--'}</td>
                    <td><span class="badge ${classeBadge}">${statusAtual}</span></td>
                    <td class="text-center">
                        <button class="btn-edit" onclick="editarConsulta('${idConsulta}')">
                            ✏️ Editar
                        </button>
                    </td>
                `;
                corpoTabela.appendChild(tr);
            });
        }

        // Inicia a busca ao carregar a página
        carregarConsultas();

        // Ação disparada ao clicar no botão Editar
        function editarConsulta(id) {
            if (!id) {
                alert("Não foi possível identificar o ID desta consulta.");
                return;
            }
            // O código do modal ou redirecionamento de edição entra aqui
            console.log("Editar consulta de ID:", id);
        }
    </script>
</body>
</html>
