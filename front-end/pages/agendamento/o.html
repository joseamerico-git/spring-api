<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedManager - Consultar Agendamentos</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --error-color: #ef4444;
            --success-color: #22c55e;
            --edit-color: #0d9488;
            --edit-hover: #115e59;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .header {
            margin-bottom: 24px;
        }

        h2 {
            color: var(--text-main);
            font-size: 24px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Barra de Pesquisa */
        .search-box {
            margin-bottom: 24px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            background-color: var(--background);
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Estilização da Tabela */
        .table-container {
            overflow-x: auto;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 15px;
        }

        .custom-table th {
            background-color: var(--background);
            color: var(--text-muted);
            padding: 14px 16px;
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
        }

        .custom-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            vertical-align: middle;
        }

        .custom-table tbody tr:hover {
            background-color: #f8fafc;
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 32px !important;
            font-style: italic;
        }

        /* Botão de Editar */
        .btn-edit {
            background-color: var(--edit-color);
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-edit:hover {
            background-color: var(--edit-hover);
        }

        .btn-edit:active {
            transform: scale(0.96);
        }

        .text-center {
            text-align: center;
        }

        /* ESTRUTURA DO MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 20px;
            color: var(--text-main);
        }

        .btn-close-modal {
            background: none;
            border: none;
            font-size: 22px;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Formulário do Modal */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary-color);
        }

        .form-group input[readonly] {
            background-color: var(--background);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-cancel {
            background-color: #fff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background-color: var(--background);
        }

        .btn-save {
            background-color: var(--primary-color);
            border: none;
            color: white;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-save:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h2>Consultar Agendamentos</h2>
            <p class="subtitle">Visualize e filtre os horários marcados na clínica</p>
        </div>

        <div class="search-box">
            <input type="text" id="inputBusca" placeholder="🔍 Digite o nome do paciente ou do médico para filtrar...">
        </div>

        <div class="table-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Paciente</th>
                        <th>Médico Responsável</th>
                        <th>Especialidade</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaConsultasCorpo">
                    <tr>
                        <td colspan="6" class="no-data">Buscando agendamentos no sistema...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- JANELA MODAL DE EDIÇÃO -->
    <div class="modal-overlay" id="modalEdicao">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Agendamento</h3>
                <button class="btn-close-modal" onclick="fecharModal()">&times;</button>
            </div>
            <form id="formEdicao" onsubmit="salvarAlteracoes(event)">
                <!-- ID Oculto para controle do PUT -->
                <input type="hidden" id="editId">

                <div class="form-group">
                    <label for="editPaciente">Paciente</label>
                    <input type="text" id="editPaciente" required>
                </div>

                <div class="form-group">
                    <label for="editMedico">Médico Responsável</label>
                    <input type="text" id="editMedico" readonly
                        title="O médico deve ser alterado pelo sistema interno de triagem">
                </div>

                <div class="form-group">
                    <label for="editData">Data da Consulta</label>
                    <input type="date" id="editData" required>
                </div>

                <div class="form-group">
                    <label for="editHora">Horário</label>
                    <input type="time" id="editHora" required>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8080/agendamentos";
        let todasAsConsultas = [];
        async function carregarConsultas() {
            const corpoTabela = document.getElementById('tabelaConsultasCorpo');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error();
                todasAsConsultas = await response.json();
                renderizarTabela(todasAsConsultas);
            } catch (error) {
                corpoTabela.innerHTML = `<tr><td colspan="6" class="no-data" style="color: var(--error-color);"> Não foi possível carregar as consultas. Certifique-se de que o backend está rodando. </td></tr>`;
            }
        }
        function normalizarTexto(texto) {
            return texto.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }
        function renderizarTabela(lista) {
            const corpoTabela = document.getElementById('tabelaConsultasCorpo');
            corpoTabela.innerHTML = '';
            if (lista.length === 0) {
                corpoTabela.innerHTML = 'Nenhum agendamento encontrado.';
                return;
            }
            lista.forEach(consulta => {
                const tr = document.createElement('tr');
                const dataFormatada = consulta.data ? consulta.data.split('-').reverse().join('/') : '--';
                const nomeMedico = consulta.medico ? consulta.medico.nome : 'Não informado';
                const especialidade = consulta.medico ? (consulta.medico.especialidade || 'Geral') : '--';
                const idConsulta = consulta.id || '';
                tr.innerHTML = `
${consulta.nomePaciente}
Dr(a). ${nomeMedico}
${especialidade}
${dataFormatada}
${consulta.hora || '--'}
`;
                corpoTabela.appendChild(tr);
            });
        }
        function abrirModalEdicao(id) {
            const consulta = todasAsConsultas.find(c => c.id === id);
            if (!consulta) {
                alert("Erro ao localizar dados do agendamento.");
                return;
            }
            document.getElementById('editId').value = consulta.id;
            document.getElementById('editPaciente').value = consulta.nomePaciente || '';
            document.getElementById('editMedico').value = consulta.medico ? `"Dr(a)".${consulta.medico.nome } : "Não informado";
            document.getElementById('editData').value = consulta.data || '';
            document.getElementById('editHora').value = consulta.hora || '';
            document.getElementById('modalEdicao').classList.add('active');
        }
        function fecharModal() {
            document.getElementById('modalEdicao').classList.remove('active');
            document.getElementById('formEdicao').reset();
        }
        async function salvarAlteracoes(event) {
            event.preventDefault();
            const id = document.getElementById('editId').value;
            const consultaOriginal = todasAsConsultas.find(c => c.id == id);
            const payload = {
                id: parseInt(id),
                nomePaciente: document.getElementById('editPaciente').value,
                data: document.getElementById('editData').value,
                hora: document.getElementById('editHora').value,
                medico: consultaOriginal ? consultaOriginal.medico : null
            };
            try {
                const response = await fetch(${ API_URL } / ${ id }, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error();
                alert("Agendamento updated com sucesso!");
                fecharModal();
                carregarConsultas();
            } catch (error) {
                alert("Falha ao salvar alterações. Verifique sua API Spring Boot.");
            }
        }
        document.getElementById('inputBusca').addEventListener('input', (e) => {
            const termoBusca = normalizarTexto(e.target.value);
            const consultasFiltradas = todasAsConsultas.filter(consulta => {
                const nomePaciente = consulta.nomePaciente ? normalizarTexto(consulta.nomePaciente) : '';
                const nomeMedico = consulta.medico && consulta.medico.nome ? normalizarTexto(consulta.medico.nome) : '';
                return nomePaciente.includes(termoBusca) || nomeMedico.includes(termoBusca);
            });
            renderizarTabela(consultasFiltradas);
        });
        window.onload = carregarConsultas;
    </script>

</body>

</html>
