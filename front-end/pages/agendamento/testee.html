<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Equipe Médica</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            color: var(--primary-color);
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 16px;
        }

        /* Grid de Cards */
        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* Card Individual */
        .doctor-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .doctor-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Foto do Médico */
        .doctor-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px auto;
            border: 3px solid #eff6ff;
            background-color: #f1f5f9;
            display: block;
        }

        .doctor-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .doctor-crm {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-color);
            background: #eff6ff;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .doctor-phone {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* Mensagens de Feedback */
        .status-message {
            text-align: center;
            font-size: 16px;
            padding: 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Corpo Clínico</h2>
    <p class="subtitle">Conheça os profissionais disponíveis para o seu atendimento</p>

    <!-- O Javascript vai injetar os cards aqui dentro -->
    <div class="doctors-grid" id="doctorsGrid">
        <div class="status-message" id="statusMessage">Carregando médicos...</div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/medicos';

    // Dispara a busca assim que a página terminar de carregar
    document.addEventListener('DOMContentLoaded', fetchDoctors);

    async function fetchDoctors() {
        const grid = document.getElementById('doctorsGrid');
        const status = document.getElementById('statusMessage');

        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Não foi possível obter dados do servidor.');

            const doctors = await response.json();

            // Caso o banco esteja vazio
            if (doctors.length === 0) {
                status.textContent = 'Nenhum médico cadastrado no momento.';
                return;
            }

            // Remove a mensagem de "Carregando"
            status.style.display = 'none';

            // Cria e renderiza o HTML para cada médico encontrado
            doctors.forEach(doctor => {
                const card = document.createElement('div');
                card.className = 'doctor-card';

                // Tratamento caso o médico não possua imagem salva no banco
                const fotoSrc = doctor.fotoBase64 && doctor.fotoBase64.trim() !== "" 
                    ? doctor.fotoBase64 
                    : 'https://flaticon.com'; // Avatar padrão cinza

                card.innerHTML = `
                    <img src="${fotoSrc}" alt="Foto de ${doctor.nome}" class="doctor-avatar">
                    <div class="doctor-name">${doctor.nome}</div>
                    <div class="doctor-crm">${doctor.numeroCrm}</div>
                    <div class="doctor-phone">📞 ${formatarCelular(doctor.celular)}</div>
                `;
                
                grid.appendChild(card);
            });

        } catch (error) {
            console.error(error);
            status.textContent = 'Erro ao conectar com a API. Verifique se o Spring Boot está rodando.';
            status.style.color = '#991b1b';
        }
    }

    // Função utilitária para aplicar máscara no celular (Ex: (11) 99999-8888)
    function formatarCelular(num) {
        if (!num) return '';
        const apenasNumeros = num.replace(/\D/g, '');
        if (apenasNumeros.length === 11) {
            return apenasNumeros.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
        } else if (apenasNumeros.length === 10) {
            return apenasNumeros.replace(/^(\d{2})(\d{4})(\d{4})$/, '($1) $2-$3');
        }
        return num; // Caso não tenha padrão numérico válido, retorna original
    }
</script>

</body>
</html>
