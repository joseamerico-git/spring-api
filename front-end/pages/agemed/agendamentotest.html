<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de Consultas</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            margin-bottom: 24px;
            color: var(--primary-color);
            text-align: center;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            background-color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 213, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Agendar Consulta</h2>
    <form id="appointmentForm">
        
        <div class="form-group">
            <label for="doctor">Médico(a)</label>
            <select id="doctor" required>
                <option value="">Selecione um médico...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="patientName">Nome do Paciente</label>
            <input type="text" id="patientName" placeholder="Seu nome completo" required>
        </div>

        <div class="form-group">
            <label for="date">Data da Consulta</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="time">Horário</label>
            <input type="time" id="time" required>
        </div>

        <button type="submit">Confirmar Agendamento</button>
    </form>

    <div id="messageBox" class="message"></div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8080';

    document.addEventListener('DOMContentLoaded', () => {
        loadDoctors();
        setupFormSubmit();
    });

    // Carrega a lista de médicos da API Spring Boot
    async function loadDoctors() {
        const doctorSelect = document.getElementById('doctor');
        try {
            const response = await fetch(`${API_BASE_URL}/medicos`);
            if (!response.ok) throw new Error('Erro ao buscar médicos');
            
            const doctors = await response.json();
            
            doctors.forEach(doctor => {
                const option = document.createElement('option');
                option.value = doctor.id;
                // CORRIGIDO: Alterado doctor.especialidade para doctor.numeroCrm
                option.textContent = `${doctor.nome} (${doctor.numeroCrm})`;
                doctorSelect.appendChild(option);
            });
        } catch (error) {
            showMessage('Não foi possível carregar a lista de médicos.', 'error');
            console.error(error);
        }
    }

    // Envia o agendamento para a API Spring Boot
    function setupFormSubmit() {
        const form = document.getElementById('appointmentForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const appointmentData = {
                medicoId: document.getElementById('doctor').value,
                nomePaciente: document.getElementById('patientName').value,
                data: document.getElementById('date').value,
                hora: document.getElementById('time').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/agendamentos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(appointmentData)
                });

                if (response.ok) {
                    showMessage('Consulta agendada com sucesso!', 'success');
                    form.reset();
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Erro ao agendar consulta');
                }
            } catch (error) {
                showMessage(`Erro: ${error.message}`, 'error');
                console.error(error);
            }
        });
    }

    function showMessage(text, type) {
        const msgBox = document.getElementById('messageBox');
        msgBox.textContent = text;
        msgBox.className = `message ${type}`;
        msgBox.style.display = 'block';
    }
</script>

</body>
</html>
