<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Equipe Médica</title>
    <link rel="stylesheet" href="./css/listar_medicos.css">
    <style>
        /* Estilos básicos para garantir o alinhamento da tabela e dos ícones */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }
        .medicos-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
        }
        .medicos-table th, .medicos-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .medicos-table th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
        }
        .col-foto { width: 70px; text-align: center; }
        .col-acoes { width: 100px; text-align: center; }
        
        .doctor-avatar-thumb {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            vertical-align: middle;
            border: 2px solid #e2e8f0;
        }

        /* Botão de Editar */
        .btn-edit {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-edit:hover { background-color: #2563eb; }

        /* Estilos do Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 { margin: 0; color: #1e293b; }
        .close-modal {
            background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8;
        }

        /* Formulário do Modal */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #475569; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;
        }
        .form-group input:focus { outline: none; border-color: #3b82f6; }

        .modal-footer {
            display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;
        }
        .btn-cancel {
            background: #e2e8f0; color: #475569; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;
        }
        .btn-save {
            background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;
        }
        .btn-save:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Corpo Clínico</h2>
        <p class="subtitle">Conheça os profissionais disponíveis para o seu atendimento</p>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar médico por nome ou CRM...">
        </div>

        <div class="status-message" id="statusMessage">Carregando médicos...</div>

        <div class="table-container" id="tableContainer" style="display: none;">
            <table class="medicos-table">
                <thead>
                    <tr>
                        <th class="col-foto">Foto</th>
                        <th>Nome</th>
                        <th>CRM</th>
                        <th>Celular</th>
                        <th class="col-acoes">Ações</th>
                    </tr>
                </thead>
                <tbody id="doctorsTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ESTRUTURA DO MODAL DE EDIÇÃO -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Médico</h3>
                <button class="close-modal" onclick="fecharModal()">&times;</button>
            </div>
            <form id="editForm" onsubmit="atualizarMedico(event)">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="editNome">Nome</label>
                    <input type="text" id="editNome" required>
                </div>
                <div class="form-group">
                    <label for="editCrm">CRM</label>
                    <input type="text" id="editCrm" required>
                </div>
                <div class="form-group">
                    <label for="editCelular">Celular</label>
                    <input type="text" id="editCelular" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8080';
        const API_URL = `${BASE_URL}/medicos`;
        let todosOsMedicos = []; 

        document.addEventListener('DOMContentLoaded', fetchDoctors);
        document.getElementById('searchInput').addEventListener('input', filtrarMedicos);

        async function fetchDoctors() {
            const status = document.getElementById('statusMessage');
            const tableContainer = document.getElementById('tableContainer');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Não foi possível obter dados do servidor.');
                todosOsMedicos = await response.json();

                if (todosOsMedicos.length === 0) {
                    status.textContent = 'Nenhum médico cadastrado no momento.';
                    return;
                }
                status.style.display = 'none';
                tableContainer.style.display = 'block';
                renderizarTabela(todosOsMedicos);
            } catch (error) {
                console.error(error);
                status.textContent = 'Erro ao conectar com a API. Verifique se o Spring Boot está rodando.';
                status.style.color = '#991b1b';
            }
        }

        function renderizarTabela(listaDeMedicos) {
            const tableBody = document.getElementById('doctorsTableBody');
            const tableContainer = document.getElementById('tableContainer');
            const status = document.getElementById('statusMessage');

            tableBody.innerHTML = '';

            if (listaDeMedicos.length === 0) {
                status.style.display = 'block';
                tableContainer.style.display = 'none';
                status.textContent = 'Nenhum médico encontrado com os filtros informados.';
                return;
            }

            status.style.display = 'none';
            tableContainer.style.display = 'block';

            listaDeMedicos.forEach(doctor => {
                const row = document.createElement('tr');
                const fotoSrc = doctor.foto && doctor.foto.trim() !== "" 
                    ? `${BASE_URL}${doctor.foto}` 
                    : `https://ui-avatars.com{encodeURIComponent(doctor.nome || 'M')}&background=random&size=128`;

                // NOTA: Passamos o ID do médico na função abrirModal
                row.innerHTML = `
                    <td class="col-foto">
                        <img src="${fotoSrc}" alt="Foto de ${doctor.nome}" class="doctor-avatar-thumb">
                    </td>
                    <td style="font-weight: 500; color: #1e293b;">${doctor.nome}</td>
                    <td>${doctor.numeroCrm || 'Não informado'}</td>
                    <td>📞 ${formatarCelular(doctor.celular)}</td>
                    <td class="col-acoes">
                        <button class="btn-edit" onclick="abrirModal(${doctor.id})">Editar</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // LÓGICA DO MODAL
        function abrirModal(id) {
            // Busca o objeto local correspondente ao ID clicado
            const medico = todosOsMedicos.find(m => m.id === id);
            if (!medico) return;

            // Preenche os campos do formulário no modal
            document.getElementById('editId').value = medico.id;
            document.getElementById('editNome').value = medico.nome || '';
            document.getElementById('editCrm').value = medico.numeroCrm || '';
            document.getElementById('editCelular').value = medico.celular || '';

            // Ativa a classe CSS para exibir o modal animado
            document.getElementById('editModal').classList.add('active');
        }

        function fecharModal() {

document.getElementById('editForm').reset();
}
async function atualizarMedico(event) {
event.preventDefault(); // Impede o recarregamento padrão da página
const id = document.getElementById('editId').value;
// Monta o payload conforme os campos que sua API Spring Boot espera (Ex: JSON)
const dadosAtualizados = {
id: parseInt(id),
nome: document.getElementById('editNome').value.trim(),
numeroCrm: document.getElementById('editCrm').value.trim(),
celular: document.getElementById('editCelular').value.trim()
};
try {
// Envia a requisição PUT para 'http://localhost:8080/medicos'
// Nota: Verifique se sua API recebe a URL com o ID no final (ex: ${API_URL}/${id}) ou se lê do corpo
const response = await fetch(API_URL, {
method: 'PUT',
headers: {
'Content-Type': 'application/json'
},
body: JSON.stringify(dadosAtualizados)
});
if (!response.ok) throw new Error('Falha ao atualizar dados no servidor.');
alert('Médico atualizado com sucesso!');
fecharModal();
fetchDoctors(); // Atualiza a tabela buscando os novos dados do banco
} catch (error) {
console.error(error);
alert('Erro ao salvar alterações. Verifique o console ou a API Spring Boot.');
}
}
function filtrarMedicos(e) {
const termoPesquisa = e.target.value.toLowerCase().trim();
const medicosFiltrados = todosOsMedicos.filter(doctor => {
const nomeMatch = doctor.nome ? doctor.nome.toLowerCase().includes(termoPesquisa) : false;
const crmMatch = doctor.numeroCrm ? doctor.numeroCrm.toLowerCase().includes(termoPesquisa) : false;
return nomeMatch || crmMatch;
});
renderizarTabela(medicosFiltrados);
}
function formatarCelular(num) {
if (!num) return 'Não informado';
const apenasNumeros = num.replace(/\D/g, '');
if (apenasNumeros.length === 11) {
return apenasNumeros.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
} else if (apenasNumeros.length === 10) {
return apenasNumeros.replace(/^(\d{2})(\d{4})(\d{4})$/, '($1) $2-$3');
}
return num;
}
