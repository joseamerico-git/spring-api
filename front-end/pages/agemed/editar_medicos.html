<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Médico</title>
    <!-- Atualizado o caminho do CSS caso utilize o mesmo padrão ou um arquivo específico -->
    <link rel="stylesheet" href="./css/editar_medicos.css">
</head>
<body>
    <div class="container">
        <h2>Editar Profissional</h2>
        <p class="subtitle">Atualize as informações do médico no sistema</p>
        
        <form id="editarMedicoForm">
            <!-- Campo oculto para armazenar o ID do médico durante a edição -->
            <input type="hidden" id="medicoId" name="id">

            <div class="form-group">
                <label for="nome">Nome do Médico:</label>
                <input type="text" id="nome" required placeholder="Ex: Dr. Carlos Silva">
            </div>

            <div class="form-group">
                <label for="crm">CRM:</label>
                <input type="text" id="crm" required placeholder="Ex: 123456/SP">
            </div>

            <div class="form-group">
                <label for="celular">Celular:</label>
                <input type="text" id="celular" required placeholder="Ex: (11) 99999-9999" maxlength="15">
            </div>

            <div class="form-group">
                <label for="especialidade">Especialidade:</label>
                <select id="especialidade" required>
                    <option value="">Selecione uma especialidade...</option>
                </select>
                <label id="especialidadeSelecionada">Especialidade: </label>
            </div>

            <div class="form-group">
                <label>Foto do Médico:</label>
                <div class="btn-group">
                    <button type="button" class="btn" id="btnModoUpload">Alterar Arquivo</button>
                    <button type="button" class="btn" id="btnModoCamera">Usar Webcam</button>
                </div>

                <!-- Opção 1: Arquivo -->
                <div id="containerUpload" style="display: none;">
                    <input type="file" id="inputArquivo" accept="image/*">
                </div>

                <!-- Opção 2: Câmera -->
                <div class="camera-container" id="containerCamera" style="display: none;">
                    <video id="video" autoplay playsinline></video>
                    <button type="button" class="btn btn-capture" id="btnCapturar">Tirar Foto</button>
                    <canvas id="canvas" style="display:none;"></canvas>
                </div>
            </div>

            <!-- Área de Preview Estilizada (Útil para carregar a foto atual do médico) -->
            <div class="preview-container">
                <label>Visualização do Perfil</label>
                <img id="preview" class="doctor-avatar-preview" alt="Preview da imagem" src="./img/default-avatar.png">
            </div>

            <button type="submit" class="btn-submit">Salvar Alterações</button>
        </form>
    </div>

    <!-- Atualizado o script para o arquivo de edição correspondente -->
    <script src="./js/editar_medicos.js"></script>
</body>
</html>
