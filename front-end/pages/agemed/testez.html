<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento da Equipe Médica</title>
    <link rel="stylesheet" href="./css/listar_medicos.css">
    <style>
        /* Estilos básicos para os novos componentes adicionados (Tabela e Modal) */
        .management-section {
            margin: 20px 0 40px 0;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .table-container {
            overflow-x: auto;
            margin-top: 15px;
        }
        .medicos-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .medicos-table th, .medicos-table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        .medicos-table th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
        }
        .btn-edit {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-edit:hover { background-color: #1d4ed8; }
        
        /* Estilos do Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block; margin-bottom: 6px; font-weight: 500; color: #334155;
        }
        .form-control {
            width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;
        }
        .modal-footer {
            display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;
        }
        .btn-cancel {
            background: #e2e8f0; color: #475569; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;
        }
        .btn-save {
            background: #16a34a; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;
        }
        .btn-save:hover { background: #15803d; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Controle do Corpo Clínico</h2>
        <p class="subtitle">Gerencie e visualize as informações dos médicos cadastrados</p>
        
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar médico por nome ou CRM...">
        </div>

        <!-- NOVO: Seção Administrativa com a Tabela -->
        <div class="management-section">
            <h3>Visualização em Lista</h3>
            <div class="table-container">
                <table class="medicos-table">
                    <thead>
                        <tr>
                           <thead>
    <tr>
        <th>Foto</th>
        <th>Nome</th>
        <th>CRM</th>
        <th>Especialidade</th>
        <th>Celular</th>
        <th>Ações</th>
    </tr>
</thead>
                        </tr>
                    </thead>
                    <tbody id="doctorsTableBody">
                        <!-- Linhas da tabela inseridas via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        
        <!-- Seção Original dos Cards -->
        <h3>Visualização em Cards</h3>
        <div class="doctors-grid" id="doctorsGrid">
            <div class="status-message" id="statusMessage">Carregando médicos...</div>
        </div>
    </div>

    <!-- NOVO: Estrutura do Modal de Edição -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Médico</h3>
                <button class="modal-close" onclick="fecharModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="editNome">Nome Completo</label>
                    <input type="text" id="editNome" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="editCrm">CRM</label>
                    <input type="text" id="editCrm" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="editCelular">Celular</label>
                    <input type="text" id="editCelular" class="form-control" required placeholder="(XX) XXXXX-XXXX">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>


    
    <script>
const BASE_URL = 'http://localhost:8080';
const API_URL = `${BASE_URL}/medicos`;
let todosOsMedicos = []; 

document.addEventListener('DOMContentLoaded', fetchDoctors);
document.getElementById('searchInput').addEventListener('input', filtrarMedicos);
document.getElementById('editForm').addEventListener('submit', salvarAlteracoesMedico);

async function fetchDoctors() {
    const status = document.getElementById('statusMessage');
    try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Não foi possível obter dados do servidor.');
        
        todosOsMedicos = await response.json();
        
        if (todosOsMedicos.length === 0) {
            status.textContent = 'Nenhum médico cadastrado no momento.';
            renderizarTabela([]);
            return;
        }
        
        status.style.display = 'none';
        renderizarCards(todosOsMedicos);
        renderizarTabela(todosOsMedicos);
    } catch (error) {
        console.error(error);
        status.textContent = 'Erro ao conectar com a API. Verifique se o Spring Boot está rodando.';
        status.style.color = '#991b1b';
    }
}

function renderizarTabela(listaDeMedicos) {
    const tbody = document.getElementById('doctorsTableBody');
    tbody.innerHTML = '';

    if (listaDeMedicos.length === 0) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 6; // Atualizado para o novo número de colunas
        cell.textContent = 'Nenhum médico correspondente encontrado.';
        cell.style.textAlign = 'center';
        cell.style.color = '#64748b';
        row.appendChild(cell);
        tbody.appendChild(row);
        return;
    }

    listaDeMedicos.forEach(doctor => {
        const row = document.createElement('tr');

        // Coluna da Foto
        const tdFoto = document.createElement('td');
        const img = document.createElement('img');
        // Usa uma imagem padrão de avatar caso o médico não tenha foto cadastrada
        img.src = doctor.fotoUrl || 'https://flaticon.com';
        img.style.width = '40px';
        img.style.height = '40px';
        img.style.borderRadius = '50%';
        img.style.objectFit = 'cover';
        tdFoto.appendChild(img);

        const tdNome = document.createElement('td');
        tdNome.textContent = doctor.nome || 'Não informado';

        const tdCrm = document.createElement('td');
        tdCrm.textContent = doctor.numeroCrm || 'Não informado';

        // Coluna da Especialidade
        const tdEspecialidade = document.createElement('td');
        tdEspecialidade.textContent = doctor.especialidade || 'Não informado';

        const tdCelular = document.createElement('td');
        tdCelular.textContent = doctor.celular || 'Não informado';

        const tdAcoes = document.createElement('td');
        const btnEdit = document.createElement('button');
        btnEdit.className = 'btn-edit';
        btnEdit.textContent = 'Editar';
        btnEdit.onclick = () => abrirModal(doctor.id);
        
        tdAcoes.appendChild(btnEdit);
        
        // Coloca os elementos na ordem correta da tabela
        row.appendChild(tdFoto);
        row.appendChild(tdNome);
        row.appendChild(tdCrm);
        row.appendChild(tdEspecialidade);
        row.appendChild(tdCelular);
        row.appendChild(tdAcoes);
        
        tbody.appendChild(row);
    });
}


function renderizarCards(listaDeMedicos) {
    const grid = document.getElementById('doctorsGrid');
    const status = document.getElementById('statusMessage');
    
    grid.innerHTML = '';
    grid.appendChild(status);

    if (listaDeMedicos.length === 0) {
        status.style.display = 'block';
        status.textContent = 'Nenhum médico encontrado com os filtros informados.';
        return;
    }

    status.style.display = 'none';

    listaDeMedicos.forEach(doctor => {
        const card = document.createElement('div');
        card.className = 'doctor-card';
        
        // CORREÇÃO: Adicionado template literal correto e fallback de imagem real
        const fotoSrc = doctor.foto && doctor.foto.trim() !== ""
            ? `${BASE_URL}${doctor.foto}`
            : 'https://unsplash.com';

        const img = document.createElement('img');
        img.src = fotoSrc;
        img.alt = `Foto de ${doctor.nome || 'Médico'}`;
        img.className = 'doctor-avatar';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'doctor-name';
        nameDiv.textContent = doctor.nome || 'Nome não informado';

        const crmDiv = document.createElement('div');
        crmDiv.className = 'doctor-crm';
        crmDiv.textContent = `CRM: ${doctor.numeroCrm || 'Não informado'}`;

        const phoneDiv = document.createElement('div');
        phoneDiv.className = 'doctor-phone';
        phoneDiv.textContent = `📞 ${formatarCelular(doctor.celular)}`;

        card.appendChild(img);
        card.appendChild(nameDiv);
        card.appendChild(crmDiv);
        card.appendChild(phoneDiv);
        grid.appendChild(card);
    });
}

function filtrarMedicos(e) {
    const termoPesquisa = e.target.value.toLowerCase().trim();
    const medicosFiltrados = todosOsMedicos.filter(doctor => {
        const nomeMatch = doctor.nome ? doctor.nome.toLowerCase().includes(termoPesquisa) : false;
        const crmString = doctor.numeroCrm ? String(doctor.numeroCrm).toLowerCase() : '';
        const crmMatch = crmString.includes(termoPesquisa);
        return nomeMatch || crmMatch;
    });

    renderizarCards(medicosFiltrados);
    renderizarTabela(medicosFiltrados);
}

function abrirModal(idMedico) {
    const medico = todosOsMedicos.find(d => d.id === idMedico);
    
    if (medico) {
        document.getElementById('editId').value = medico.id;
        document.getElementById('editNome').value = medico.nome || '';
        document.getElementById('editCrm').value = medico.numeroCrm || '';
        document.getElementById('editEspecialidade').value = medico.especialidade || '';
        document.getElementById('editCelular').value = medico.celular || '';
        document.getElementById('editFotoUrl').value = medico.fotoUrl || '';
        
        // Exibe e atualiza o preview da miniatura no modal
        const preview = document.getElementById('editFotoPreview');
        preview.src = medico.fotoUrl || 'https://flaticon.com';
        preview.style.display = 'inline-block';
        
        document.getElementById('editModal').classList.add('active');
    }
}

function fecharModal() {
    document.getElementById('editModal').classList.remove('active');
    document.getElementById('editForm').reset();
}
async function salvarAlteracoesMedico(event) {
    event.preventDefault();

    const id = document.getElementById('editId').value;
    const dadosAtualizados = {
        id: id,
        nome: document.getElementById('editNome').value,
        numeroCrm: document.getElementById('editCrm').value,
        especialidade: document.getElementById('editEspecialidade').value,
        celular: document.getElementById('editCelular').value,
        fotoUrl: document.getElementById('editFotoUrl').value
    };

    try {
        const response = await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dadosAtualizados)
        });

        if (!response.ok) throw new Error('Falha ao atualizar os dados do médico.');

        alert('Médico atualizado com sucesso!');
        fecharModal();
        fetchDoctors(); 
    } catch (error) {
        console.error(error);
        alert('Erro ao salvar alterações. Verifique os campos e tente novamente.');
    }
}
function formatarCelular(num) {
    if (!num) return 'Não informado';
    const apenasNumeros = String(num).replace(/\D/g, '');
    if (apenasNumeros.length === 11) {
        return apenasNumeros.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
    } else if (apenasNumeros.length === 10) {
        return apenasNumeros.replace(/^(\d{2})(\d{4})(\d{4})$/, '($1) $2-$3');
    }
    return num;
}
</script>

</body>
</html>
