<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Equipe Médica</title>
    <link rel="stylesheet" href="./css/listar_medicos.css">
    <style>
        /* Estilos para o feedback visual do card */
        .doctor-card {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative; /* Necessário para posicionar elementos internos se precisar */
        }
        .doctor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        /* Estilização do botão de edição */
        .btn-edit {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
            width: 100%; /* Ocupa a largura do card */
            text-align: center;
        }
        .btn-edit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Corpo Clínico</h2>
    <p class="subtitle">Conheça os profissionais disponíveis para o seu atendimento</p>

    <!-- Barra de busca adicionada -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar médico por nome ou CRM...">
    </div>

    <!-- O Javascript vai injetar os cards aqui dentro -->
    <div class="doctors-grid" id="doctorsGrid">
        <div class="status-message" id="statusMessage">Carregando médicos...</div>
    </div>
</div>

<script>
     // URL base da sua API Spring Boot
    const BASE_URL = 'http://localhost:8080';
    const API_URL = `${BASE_URL}/medicos`;

    let todosOsMedicos = []; // Guarda a lista completa vinda da API

    // Dispara a busca assim que a página terminar de carregar
    document.addEventListener('DOMContentLoaded', fetchDoctors);

    // Monitora a digitação no campo de pesquisa
    document.getElementById('searchInput').addEventListener('input', filtrarMedicos);

    async function fetchDoctors() {
        const status = document.getElementById('statusMessage');

        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Não foi possível obter dados do servidor.');

            todosOsMedicos = await response.json();

            // Se o banco estiver vazio
            if (todosOsMedicos.length === 0) {
                status.textContent = 'Nenhum médico cadastrado no momento.';
                return;
            }

            // Esconde o status inicial de carregamento
            status.style.display = 'none';

            // Renderiza todos os registros inicialmente
            renderizarCards(todosOsMedicos);

        } catch (error) {
            console.error(error);
            status.textContent = 'Erro ao conectar com a API. Verifique se o Spring Boot está rodando.';
            status.style.color = '#991b1b';
        }
    }

    // Função responsável por desenhar os cards na tela
    function renderizarCards(listaDeMedicos) {
        const grid = document.getElementById('doctorsGrid');
        
        // Limpa os cards anteriores mantendo a mensagem de status se necessária
        const status = document.getElementById('statusMessage');
        grid.innerHTML = '';
        grid.appendChild(status);

        if (listaDeMedicos.length === 0) {
            status.style.display = 'block';
            status.textContent = 'Nenhum médico encontrado com os filtros informados.';
            return;
        }

        status.style.display = 'none';

        listaDeMedicos.forEach(doctor => {
            const card = document.createElement('div');
            card.className = 'doctor-card';

            // Redireciona para visualização de detalhes ao clicar no card
            card.addEventListener('click', () => {
                window.location.href = `detalhes.html?id=${doctor.id}`;
            });

            // Concatena o endereço do Spring Boot com o caminho relativo da imagem
            const fotoSrc = doctor.foto && doctor.foto.trim() !== "" 
                ? `${BASE_URL}${doctor.foto}` 
                : 'https://unsplash.com'; 

            // Injeta o HTML do médico incluindo o botão de edição
            card.innerHTML = `
                <img src="${fotoSrc}" alt="Foto de ${doctor.nome}" class="doctor-avatar">
                <div class="doctor-name">${doctor.nome}</div>
                <div class="doctor-crm">CRM: ${doctor.numeroCrm || 'Não informado'}</div>
                <div class="doctor-phone">📞 ${formatarCelular(doctor.celular)}</div>
                <button class="btn-edit">✏️ Editar</button>
            `;
            
            // Captura o botão que acabou de ser injetado para adicionar o evento de clique
            const btnEditar = card.querySelector('.btn-edit');
            btnEditar.addEventListener('click', (e) => {
                e.stopPropagation(); // IMPORTANTE: Impede que o clique no botão ative o clique do card completo
                irParaEdicao(doctor.id);
            });

            grid.appendChild(card);
        });
    }

    // Função chamada ao clicar no botão Editar
    function irParaEdicao(idMedico) {
        // Opção 1: Redirecionar para uma página de formulário passando o ID na URL
        window.location.href = `editar_medicos.html?id=${idMedico}`;
        
        // Opção 2: Se você preferir usar um Modal na mesma página, você faria uma busca assim:
        /*
        fetch(`${API_URL}/${idMedico}`)
            .then(res => res.json())
            .then(medico => {
                // Aqui você preenche os inputs do seu formulário/modal
                document.getElementById('inputNome').value = medico.nome;
                document.getElementById('inputCrm').value = medico.numeroCrm;
                // ... abrirModal();
            });
        */
    }

    // Função de filtro em tempo real (Frontend-side Filter)
    function filtrarMedicos(e) {
        const termoPesquisa = e.target.value.toLowerCase().trim();

        const medicosFiltrados = todosOsMedicos.filter(doctor => {
            const nomeMatch = doctor.nome ? doctor.nome.toLowerCase().includes(termoPesquisa) : false;
            const crmMatch = doctor.numeroCrm ? doctor.numeroCrm.toLowerCase().includes(termoPesquisa) : false;
            return nomeMatch || crmMatch;
        });

        renderizarCards(medicosFiltrados);
    }

    // Função utilitária para aplicar máscara no celular
    function formatarCelular(num) {
        if (!num) return 'Não informado';
        const apenasNumeros = num.replace(/\D/g, '');
        if (apenasNumeros.length === 11) {
            return apenasNumeros.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
        } else if (apenasNumeros.length === 10) {
            return apenasNumeros.replace(/^(\d{2})(\d{4})(\d{4})$/, '($1) $2-$3');
        }
        return num;
    }

</script>

</body>
</html>
