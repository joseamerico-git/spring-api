<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Médico</title>
   <link rel="stylesheet" href="./css/cadastro_medicos.css">
   <link rel="stylesheet" href="./css/global.css">
</head>

<body>

    <div class="container">

             <div class="header-actions">
            <a href="index.html" class="btn-back">
                🏠 Voltar para a Home
            </a>
        </div>
        <h2>Novo Profissional</h2>
        <p class="subtitle">Insira as informações do médico no sistema</p>
      

        <form id="medicoForm">
            <div class="form-group">
                <label for="nome">Nome do Médico:</label>
                <input type="text" id="nome" required placeholder="Ex: Dr. Carlos Silva">
            </div>

            <div class="form-group">
                <label for="crm">CRM:</label>
                <input type="text" id="crm" required placeholder="Ex: 123456/SP">
            </div>

            <div class="form-group">
                <label for="celular">Celular:</label>
                <input type="text" id="celular" required placeholder="Ex: (11) 99999-9999" maxlength="15">
            </div>

            <!-- NOVO: Campo de especialidade vindo do enum do backend -->
            <div class="form-group">
                <label for="especialidade">Especialidade:</label>
                <select id="especialidade" required>
                    <option value="">Selecione uma especialidade...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Foto do Médico:</label>
                <div class="btn-group">
                    <button type="button" class="btn" id="btnModoUpload">Enviar Arquivo</button>
                    <button type="button" class="btn" id="btnModoCamera">Usar Webcam</button>
                </div>

                <!-- Opção 1: Arquivo -->
                <div id="containerUpload" style="display: none;">
                    <input type="file" id="inputArquivo" accept="image/*">
                </div>

                <!-- Opção 2: Câmera -->
                <div class="camera-container" id="containerCamera">
                    <video id="video" autoplay playsinline></video>
                    <button type="button" class="btn btn-capture" id="btnCapturar">Tirar Foto</button>
                    <canvas id="canvas" style="display:none;"></canvas>
                </div>
            </div>

            <!-- Área de Preview Estilizada -->
            <div class="preview-container">
                <label>Visualização do Perfil</label>
                <img id="preview" class="doctor-avatar-preview" alt="Preview da imagem">
            </div>

            <button type="submit" class="btn-submit">Salvar Médico</button>
        </form>
    </div>

    <script src="./js/cadastro_medicos.js">
       
    </script>
