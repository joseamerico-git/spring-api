<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f8f9fa; display: flex; justify-content: center; }
        
        /* Container centralizado e vertical */
        .painel { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2, h3 { color: #333; margin-top: 0; }
        
        /* Formulário e Inputs */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 12px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #218838; }
        
        /* Previews e Mensagens */
        .preview-container { margin-top: 10px; display: none; }
        .preview-container img { max-width: 100px; max-height: 100px; border: 1px dashed #ccc; border-radius: 4px; padding: 5px; }
        #mensagem { margin-top: 15px; font-weight: bold; text-align: center; }

        /* Card de Resumo Compacto (Abaixo do formulário) */
        .resumo-secao { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .card-produto-mini { display: flex; align-items: center; gap: 15px; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; background: #fafafa; }
        .card-produto-mini img { width: 70px; height: 70px; object-fit: contain; border-radius: 4px; background: white; border: 1px solid #eee; }
        .produto-detalhes { display: flex; flex-direction: column; gap: 2px; }
        .produto-info { font-size: 13px; color: #555; }
        .produto-nome { font-size: 14px; font-weight: bold; color: #333; }
        .produto-preco { font-size: 15px; color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <div class="painel">
        <h2>Cadastrar Produto</h2>
        <form id="produtoForm">
            <div class="form-group">
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" required placeholder="Ex: Mouse Sem Fio">
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" step="0.01" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="imagem">Imagem do Produto:</label>
                <input type="file" id="imagem" accept="image/*" required>
                
                <div class="preview-container" id="previewContainer">
                    <p style="font-size: 11px; color: #888; margin: 5px 0;">Pré-visualização:</p>
                    <img id="imagemPreview" src="" alt="Preview">
                </div>
            </div>

            <button type="submit">Enviar Produto</button>
        </form>
        
        <!-- Mensagem de Sucesso/Erro -->
        <div id="mensagem"></div>

        <!-- Seção de Resumo compactada logo abaixo -->
        <div class="resumo-secao" id="resumoSecao" style="display: none;">
            <p style="font-size: 12px; font-weight: bold; color: #666; margin: 0 0 8px 0;">Último cadastrado:</p>
            <div id="containerResumo"></div>
        </div>
    </div>

    <script>
        const backendUrl = 'http://localhost:8080';
        const imagemInput = document.getElementById('imagem');
        const previewContainer = document.getElementById('previewContainer');
        const imagemPreview = document.getElementById('imagemPreview');
        const resumoSecao = document.getElementById('resumoSecao');
        const containerResumo = document.getElementById('containerResumo');

        // Preview de imagem local antes do envio
        imagemInput.addEventListener('change', function() {
            const arquivo = this.files[0];
            if (arquivo) {
                const leitor = new FileReader();
                leitor.addEventListener('load', function() {
                    imagemPreview.setAttribute('src', this.result);
                    previewContainer.style.display = 'block';
                });
                leitor.readAsDataURL(arquivo);
            } else {
                previewContainer.style.display = 'none';
            }
        });

        // Envio do formulário
        document.getElementById('produtoForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const mensagemDiv = document.getElementById('mensagem');
            mensagemDiv.innerText = "Enviando...";
            mensagemDiv.style.color = "black";

            const formData = new FormData();
            formData.append('nome', document.getElementById('nome').value);
            formData.append('preco', document.getElementById('preco').value);
            formData.append('imagem', imagemInput.files[0]);

            try {
                const response = await fetch(`${backendUrl}/produtos`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const produtoSalvo = await response.json();
                    
                    mensagemDiv.innerText = "Cadastrado com sucesso!";
                    mensagemDiv.style.color = "green";

                    // Constrói a URL da imagem guardada no Spring Boot
                    const urlImagemServidor = `${backendUrl}${produtoSalvo.imagemUrl}`;

                    // Gera o mini card com layout horizontal (Flex)
                    containerResumo.innerHTML = `
                        <div class="card-produto-mini">
                            <img src="${urlImagemServidor}" alt="${produtoSalvo.nome}" onerror="this.src='https://placehold.co'">
                            <div class="produto-detalhes">
                                <span class="produto-info">#${produtoSalvo.id}</span>
                                <span class="produto-nome">${produtoSalvo.nome}</span>
                                <span class="produto-preco">R$ ${produtoSalvo.preco.toFixed(2)}</span>
                            </div>
                        </div>
                    `;

                    // Torna a seção do mini resumo visível
                    resumoSecao.style.display = 'block';

                    // Reseta o formulário
                    document.getElementById('produtoForm').reset();
                    previewContainer.style.display = 'none';

                } else {
                    mensagemDiv.innerText = "Erro no servidor. Status: " + response.status;
                    mensagemDiv.style.color = "red";
                }
            } catch (error) {
                console.error(error);
                mensagemDiv.innerText = "Erro de conexão.";
                mensagemDiv.style.color = "red";
            }
        });
    </script>
</body>
</html>
