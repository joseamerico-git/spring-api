<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto com Múltiplas Imagens</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f8f9fa; display: flex; justify-content: center; }
        .painel { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        h2 { color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 12px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #218838; }
        
        /* Grids para agrupar as múltiplas imagens do preview e resumo */
        .preview-container { margin-top: 10px; display: none; }
        .grid-imagens { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
        .grid-imagens img { width: 60px; height: 60px; object-fit: contain; border: 1px dashed #ccc; border-radius: 4px; padding: 2px; background: #fff; }
        
        #mensagem { margin-top: 15px; font-weight: bold; text-align: center; }
        .resumo-secao { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        
        /* Card de Resumo Horizontal Ajustado */
        .card-produto-mini { border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; background: #fafafa; }
        .produto-detalhes { margin-bottom: 10px; display: flex; flex-direction: column; gap: 2px; }
        .produto-info { font-size: 12px; color: #777; }
        .produto-nome { font-size: 15px; font-weight: bold; color: #333; }
        .produto-preco { font-size: 16px; color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <div class="painel">
        <h2>Cadastrar Produto</h2>
        <form id="produtoForm">
            <div class="form-group">
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" required placeholder="Ex: Kit Gamer">
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" step="0.01" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="imagens">Imagens do Produto:</label>
                <!-- ATENÇÃO: Adicionado o atributo 'multiple' aqui -->
                <input type="file" id="imagens" accept="image/*" multiple required>
                
                <div class="preview-container" id="previewContainer">
                    <p style="font-size: 11px; color: #888; margin: 5px 0;">Pré-visualização das fotos:</p>
                    <div id="listaPreviews" class="grid-imagens"></div>
                </div>
            </div>

            <button type="submit">Enviar Produto</button>
        </form>
        
        <div id="mensagem"></div>

        <div class="resumo-secao" id="resumoSecao" style="display: none;">
            <p style="font-size: 12px; font-weight: bold; color: #666; margin: 0 0 8px 0;">Último cadastrado:</p>
            <div id="containerResumo"></div>
        </div>
    </div>

    <script>
        const backendUrl = 'http://localhost:8080';
        const imagensInput = document.getElementById('imagens');
        const previewContainer = document.getElementById('previewContainer');
        const listaPreviews = document.getElementById('listaPreviews');
        const resumoSecao = document.getElementById('resumoSecao');
        const containerResumo = document.getElementById('containerResumo');

        // Lógica para gerar múltiplos previews locais antes do envio
        imagensInput.addEventListener('change', function() {
            listaPreviews.innerHTML = ''; // Limpa os previews anteriores
            const arquivos = this.files;

            if (arquivos && arquivos.length > 0) {
                previewContainer.style.display = 'block';
                
                // Percorre todos os arquivos selecionados para criar as tags img
                Array.from(arquivos).forEach(arquivo => {
                    const leitor = new FileReader();
                    leitor.addEventListener('load', function() {
                        const img = document.createElement('img');
                        img.src = this.result;
                        listaPreviews.appendChild(img);
                    });
                    leitor.readAsDataURL(arquivo);
                });
            } else {
                previewContainer.style.display = 'none';
            }
        });

        // Envio do formulário com múltiplos arquivos
        document.getElementById('produtoForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const mensagemDiv = document.getElementById('mensagem');
            mensagemDiv.innerText = "Enviando...";
            mensagemDiv.style.color = "black";

            const formData = new FormData();
            formData.append('nome', document.getElementById('nome').value);
            formData.append('preco', document.getElementById('preco').value);
            
            // Adiciona todas as imagens selecionadas no mesmo campo 'imagens' do FormData
            const arquivos = imagensInput.files;
            for (let i = 0; i < arquivos.length; i++) {
                formData.append('imagens', arquivos[i]);
            }

            try {
                const response = await fetch(`${backendUrl}/produtos`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const produtoSalvo = await response.json();
                    mensagemDiv.innerText = "Cadastrado com sucesso!";
                    mensagemDiv.style.color = "green";

                    // Gera as tags HTML de imagem vindas do servidor do Spring
                    let imagensHtml = '';
                    produtoSalvo.imagensUrls.forEach(url => {
                        console.log(url)
                        imagensHtml += `<img src="${backendUrl}${url}" onerror="this.src='https://placehold.co'">`;
                       
                    });

                    // Renderiza o resumo compacto contendo a lista de fotos salvas
                    containerResumo.innerHTML = `
                        <div class="card-produto-mini">
                            <div class="produto-detalhes">
                                <span class="produto-info">#${produtoSalvo.id}</span>
                                <span class="produto-nome">${produtoSalvo.nome}</span>
                                <span class="produto-preco">R$ ${produtoSalvo.preco.toFixed(2)}</span>
                            </div>
                            <div class="grid-imagens">
                                ${imagensHtml}
                                
                            </div>
                        </div>
                    `;

                    resumoSecao.style.display = 'block';
                    document.getElementById('produtoForm').reset();
                    previewContainer.style.display = 'none';
                } else {
                    mensagemDiv.innerText = "Erro no servidor. Status: " + response.status;
                    mensagemDiv.style.color = "red";
                }
            } catch (error) {
                console.error(error);
                mensagemDiv.innerText = "Erro de conexão.";
                mensagemDiv.style.color = "red";
            }
        });
    </script>
</body>
</html>
